<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Event Budget Planner — Demo</title>
<meta name="robots" content="noindex">
<meta name="description" content="Plan, track and fund your wedding or event budget — categories, payments, vendors, guests and scenarios. Works offline, data stays on your device.">
<meta name="theme-color" content="#FAF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234F6B57'/%3E%3Cpath d='M32 47s-14-8.4-14-18.2A7.8 7.8 0 0 1 32 24a7.8 7.8 0 0 1 14 4.8C46 38.6 32 47 32 47Z' fill='%23FAF7F2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<style>
/* =====================================================================
   TOKENS
   ===================================================================== */
:root{
  --bg:#FAF7F2; --surface:#FFFFFF; --surface-2:#F4EFE7; --surface-3:#ECE5DA;
  --line:#E6DFD3; --line-strong:#CDC3B3;
  --ink:#1E2126; --ink-2:#3F434A; --muted:#5D6169;
  --accent:#4F6B57; --accent-strong:#3D5444; --accent-ink:#FFFFFF; --accent-soft:#E4ECE5; --accent-tint:#F0F4F0;
  --rose:#A9706B; --rose-soft:#F5E8E5;
  --success:#2E7348; --success-soft:#E2F0E6;
  --warning:#8A5A00; --warning-soft:#FBEFD5;
  --danger:#B3261E; --danger-soft:#FBE5E2;
  --focus:#2B5FAA;
  --overlay:rgba(24,22,20,.42);
  --shadow-1:0 1px 2px rgba(40,34,26,.06),0 1px 1px rgba(40,34,26,.04);
  --shadow-2:0 10px 30px rgba(40,34,26,.08),0 2px 8px rgba(40,34,26,.05);
  --shadow-3:0 24px 60px rgba(40,34,26,.18);
  --r-sm:8px; --r:12px; --r-lg:16px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --font-serif:'Cormorant Garamond','Noto Naskh Arabic',Georgia,'Times New Roman',serif;
  --font-sans:'Inter','Noto Naskh Arabic',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --topbar-h:64px; --bottombar-h:64px; --maxw:1280px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181B; --surface:#1E2125; --surface-2:#25292E; --surface-3:#2D3238;
    --line:#33383F; --line-strong:#4A515A;
    --ink:#EEEAE3; --ink-2:#D4D0C8; --muted:#A9ACB2;
    --accent:#9CC0A5; --accent-strong:#B6D4BD; --accent-ink:#10231A; --accent-soft:#263A2D; --accent-tint:#1F2B23;
    --rose:#D9A7A1; --rose-soft:#3A2A28;
    --success:#86CFA0; --success-soft:#1D3326;
    --warning:#EBC067; --warning-soft:#3A3020;
    --danger:#F4A39B; --danger-soft:#422523;
    --focus:#8DB4FF;
    --overlay:rgba(0,0,0,.6);
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 10px 30px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.3);
    --shadow-3:0 24px 60px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16181B; --surface:#1E2125; --surface-2:#25292E; --surface-3:#2D3238;
  --line:#33383F; --line-strong:#4A515A;
  --ink:#EEEAE3; --ink-2:#D4D0C8; --muted:#A9ACB2;
  --accent:#9CC0A5; --accent-strong:#B6D4BD; --accent-ink:#10231A; --accent-soft:#263A2D; --accent-tint:#1F2B23;
  --rose:#D9A7A1; --rose-soft:#3A2A28;
  --success:#86CFA0; --success-soft:#1D3326;
  --warning:#EBC067; --warning-soft:#3A3020;
  --danger:#F4A39B; --danger-soft:#422523;
  --focus:#8DB4FF;
  --overlay:rgba(0,0,0,.6);
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 10px 30px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.3);
  --shadow-3:0 24px 60px rgba(0,0,0,.55);
  color-scheme:dark;
}

/* =====================================================================
   BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;
}
[dir="rtl"] body{font-size:16px}
h1,h2,h3,h4{font-family:var(--font-serif);font-weight:600;letter-spacing:.005em;line-height:1.15;margin:0;color:var(--ink)}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3,[dir="rtl"] h4{font-family:'Noto Naskh Arabic',var(--font-serif);letter-spacing:0}
h1{font-size:clamp(30px,5vw,44px)}
h2{font-size:clamp(24px,3.4vw,30px)}
h3{font-size:21px}
p{margin:0}
a{color:var(--accent-strong)}
:root[data-theme="dark"] a:not([class]){color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img,svg{display:block}
.num,.money{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus{outline:none}
main:focus,main:focus-visible{outline:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:16px;height:16px}
.i-lg{width:28px;height:28px}
[dir="rtl"] .flip{transform:scaleX(-1)}
.skip-link{position:absolute;inset-inline-start:8px;top:-60px;z-index:100;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:var(--r-sm);text-decoration:none;font-weight:600}
.skip-link:focus{top:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.strong{font-weight:600}
.pos{color:var(--success)} .neg{color:var(--danger)} .warn{color:var(--warning)}
.nowrap{white-space:nowrap}
.ellipsis{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.row{display:flex;align-items:center;gap:var(--s2)}
.row-wrap{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:var(--s4)}
.stack-sm{display:flex;flex-direction:column;gap:var(--s2)}
.hidden{display:none!important}

/* =====================================================================
   LAYOUT: TOP BAR, TABS, BOTTOM NAV
   ===================================================================== */
.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{max-width:var(--maxw);margin:0 auto;padding:0 var(--s4);height:var(--topbar-h);display:flex;align-items:center;gap:var(--s3)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand-name{font-family:var(--font-serif);font-size:22px;font-weight:600;white-space:nowrap}
.event-switch{min-width:0;flex:1 1 auto;max-width:280px}
.event-switch select{width:100%;height:40px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--surface);padding-inline:14px 34px;font-weight:500;text-overflow:ellipsis}
.tabs{display:none;gap:2px;margin-inline-start:var(--s2)}
.tab{
  display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:var(--r-pill);
  color:var(--ink-2);text-decoration:none;font-weight:500;font-size:14px;border:0;background:transparent;white-space:nowrap
}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tab .i{width:18px;height:18px}
.top-actions{display:flex;align-items:center;gap:4px;margin-inline-start:auto;flex:none}
.saved{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:0 6px;transition:opacity .4s var(--ease)}
.saved .dot{width:8px;height:8px;border-radius:50%;background:var(--success)}
.saved[data-state="saving"] .dot{background:var(--warning)}
.saved[data-state="off"] .dot{background:var(--danger)}
.saved-text{white-space:nowrap}
.bottom-nav{
  position:fixed;inset-inline:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(7,1fr);
  background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
}
.bottom-nav a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--bottombar-h);
  color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:500;min-width:0;padding:0 2px;position:relative
}
.bottom-nav a span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bottom-nav a[aria-current="page"]{color:var(--accent-strong)}
:root[data-theme="dark"] .bottom-nav a[aria-current="page"]{color:var(--accent)}
.bottom-nav a[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.badge-dot{position:absolute;top:10px;inset-inline-end:calc(50% - 18px);min-width:16px;height:16px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
main{max-width:var(--maxw);margin:0 auto;padding:var(--s5) var(--s4) calc(var(--bottombar-h) + var(--s7) + env(safe-area-inset-bottom))}
@media (min-width:960px){
  .tabs{display:flex}
  .bottom-nav{display:none}
  main{padding:var(--s6) var(--s5) var(--s8)}
  .topbar-inner{padding:0 var(--s5)}
  .event-switch{max-width:220px}
}
@media (max-width:1560px) and (min-width:960px){ .brand-name{display:none} .event-switch{max-width:240px;min-width:150px} }
@media (max-width:1180px) and (min-width:960px){ .tab span{display:none} .tab{padding:0 11px} }
@media (max-width:959px){ .tab .badge-dot{display:none} }
@media (max-width:520px){
  .brand-name{display:none}
  .saved-text{display:none}
  .topbar-inner{gap:var(--s2);padding:0 var(--s3)}
}

/* =====================================================================
   COMPONENTS
   ===================================================================== */
.view{animation:viewIn .35s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s3) var(--s4);margin-bottom:var(--s5)}
.view-head .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
[dir="rtl"] .view-head .eyebrow{letter-spacing:0}
.view-head p.lede{color:var(--muted);margin-top:6px;max-width:60ch}
.view-head .actions{margin-inline-start:auto;display:flex;flex-wrap:wrap;gap:var(--s2)}
.section{margin-top:var(--s6)}
.section-title{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s3)}
.section-title h2,.section-title h3{flex:1}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:var(--s5);min-width:0}
.card-tight{padding:var(--s4)}
.card h3{margin-bottom:var(--s3)}
.card-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4);flex-wrap:wrap}
.card-head h3{margin:0;flex:1;min-width:0}
.grid{display:grid;gap:var(--s4)}
.grid-2{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
.grid-3{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){ .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))} .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))} }
.grid-auto{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr))}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--r-pill);
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:500;font-size:14px;text-decoration:none;
  transition:background .2s var(--ease),border-color .2s var(--ease),transform .1s var(--ease);white-space:nowrap
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn-danger:hover{background:var(--danger-soft)}
.btn-solid-danger{background:var(--danger);border-color:var(--danger);color:#fff}
:root[data-theme="dark"] .btn-solid-danger{color:#2a0f0d}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}
.btn-icon{width:40px;height:40px;padding:0;border-radius:50%;border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-icon:hover{background:var(--surface-2);color:var(--ink)}
.btn-icon.sm{width:32px;height:32px;min-height:32px}
.btn-icon[aria-pressed="true"]{color:var(--accent-strong);background:var(--accent-soft)}
:root[data-theme="dark"] .btn-icon[aria-pressed="true"]{color:var(--accent)}

/* Segmented control */
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-pill);padding:4px;gap:2px;border:1px solid var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;padding:0 14px;min-height:34px;border-radius:var(--r-pill);font-size:13.5px;font-weight:500;color:var(--ink-2);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
.seg .count{font-size:11.5px;color:var(--muted);font-weight:600}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12.5px;color:var(--muted)}
.input,.select,.textarea{
  width:100%;min-height:42px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);
  padding:8px 12px;transition:border-color .15s,box-shadow .15s;min-width:0
}
.textarea{min-height:84px;resize:vertical}
.select{padding-inline-end:28px}
.input:hover,.select:hover,.textarea:hover{border-color:var(--muted)}
.input:focus-visible,.select:focus-visible,.textarea:focus-visible{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent);outline:none}
.input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 18%,transparent)}
.input[readonly]{background:var(--surface-2);color:var(--ink-2)}
.input.money{text-align:end}
.field-error{display:block;color:var(--danger);font-size:12.5px;font-weight:500;margin-top:4px}
.input-affix{position:relative;display:flex;align-items:center}
.input-affix .affix{position:absolute;inset-inline-start:12px;color:var(--muted);font-size:13px;pointer-events:none}
.input-affix .input{padding-inline-start:46px}
.input-search{position:relative;flex:1 1 220px;min-width:0}
.input-search .i{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.input-search .input{padding-inline-start:38px;border-radius:var(--r-pill)}
.form-grid{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
@media (min-width:600px){ .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .form-grid .full{grid-column:1/-1} }
.check{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.switch{position:relative;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:500;min-height:40px}
.switch input{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line-strong);position:relative;transition:background .2s;flex:none;cursor:pointer;margin:0}
.switch input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(18px)}
[dir="rtl"] .switch input:checked::after{transform:translateX(-18px)}
.switch input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* Chips & badges */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink-2);font-size:12.5px;font-weight:500;border:1px solid var(--line);white-space:nowrap}
.chip-btn{cursor:pointer;min-height:40px;padding:0 14px;font-size:14px}
.chip-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip-btn[aria-disabled="true"]{opacity:.5}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-pill);font-size:12px;font-weight:600;white-space:nowrap;line-height:20px}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-neutral{background:var(--surface-2);color:var(--ink-2)}
.b-accent{background:var(--accent-soft);color:var(--accent-strong)}
:root[data-theme="dark"] .b-accent{color:var(--accent-strong)}
.b-success{background:var(--success-soft);color:var(--success)}
.b-warning{background:var(--warning-soft);color:var(--warning)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-rose{background:var(--rose-soft);color:var(--rose)}
:root:not([data-theme="dark"]) .b-rose{color:#8A4F4A}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .b-rose{color:var(--rose)} }

/* Progress */
.progress{position:relative;height:8px;border-radius:var(--r-pill);background:var(--surface-3);overflow:hidden}
.progress>span{position:absolute;inset-block:0;inset-inline-start:0;border-radius:inherit;background:var(--success);transition:width .7s var(--ease),background-color .3s}
.progress.amber>span{background:var(--warning)}
.progress.red>span{background:var(--danger)}
.progress.accent>span{background:var(--accent)}
.progress.lg{height:12px}
.progress .over{position:absolute;inset-block:0;inset-inline-end:0;background:repeating-linear-gradient(45deg,var(--danger) 0 4px,transparent 4px 8px);opacity:.35}

/* KPI cards */
.kpis{display:grid;gap:var(--s3);grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){ .kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:1180px){ .kpis{grid-template-columns:repeat(6,minmax(0,1fr))} }
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s4);display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--shadow-1)}
.kpi .label{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .value{font-size:clamp(19px,2.4vw,24px);font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi .sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.neg .value{color:var(--danger)}
.kpi.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.accent .label,.kpi.accent .sub{color:color-mix(in srgb,var(--accent-ink) 82%,transparent)}

/* Hero */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-lg);padding:var(--s6) var(--s5);margin-bottom:var(--s5);
  background:
    radial-gradient(120% 140% at 100% 0%,var(--rose-soft) 0%,transparent 55%),
    radial-gradient(90% 120% at 0% 100%,var(--accent-soft) 0%,transparent 60%),
    var(--surface);
  border:1px solid var(--line);display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)
}
@media (min-width:760px){ .hero{grid-template-columns:minmax(0,1fr) auto;align-items:end;padding:var(--s7) var(--s6)} }
.hero .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
[dir="rtl"] .hero .eyebrow{letter-spacing:0}
.hero h1{margin:6px 0 8px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--ink-2)}
.countdown{display:flex;gap:var(--s4);align-items:flex-end}
.countdown .big{font-family:var(--font-serif);font-size:clamp(52px,9vw,84px);line-height:.9;font-weight:600}
.countdown .unit{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
[dir="rtl"] .countdown .unit{letter-spacing:0}
.countdown .sep{width:1px;align-self:stretch;background:var(--line-strong)}
.health{display:inline-flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:var(--r-pill);font-weight:600;font-size:14px;margin-top:var(--s3)}
.health.badge::before{display:none}
.health .pip{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 18%,transparent)}
.health .reason{font-weight:500;color:var(--ink-2)}

/* Lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list>li{display:flex;align-items:center;gap:var(--s3);padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.list>li:last-child{border-bottom:0}
.list .grow{flex:1;min-width:0}
@media (max-width:520px){ .hide-sm{display:none} }
.list .title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.insight{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r);background:var(--surface-2)}
.insight + .insight{margin-top:8px}
.insight .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.insight.tone-danger .ic{background:var(--danger-soft);color:var(--danger)}
.insight.tone-warning .ic{background:var(--warning-soft);color:var(--warning)}
.insight.tone-success .ic{background:var(--success-soft);color:var(--success)}
.insight.tone-info .ic{background:var(--accent-soft);color:var(--accent-strong)}

/* Empty state */
.empty{text-align:center;padding:var(--s6) var(--s4);display:flex;flex-direction:column;align-items:center;gap:var(--s3);color:var(--muted)}
.empty .art{width:64px;height:64px;border-radius:50%;background:var(--accent-tint);color:var(--accent-strong);display:grid;place-items:center;border:1px dashed var(--line-strong)}
:root[data-theme="dark"] .empty .art{color:var(--accent)}
.empty h3{color:var(--ink);font-size:22px}
.empty p{max-width:42ch}
.empty.compact{padding:var(--s4);flex-direction:row;justify-content:space-between;text-align:start;flex-wrap:wrap}

/* Alerts banners */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);border:1px solid;font-size:14px}
.alert .i{margin-top:1px}
.alert.danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 30%,transparent);color:var(--danger)}
.alert.warning{background:var(--warning-soft);border-color:color-mix(in srgb,var(--warning) 30%,transparent);color:var(--warning)}
.alert.info{background:var(--accent-tint);border-color:var(--line);color:var(--ink-2)}
.alert b{font-weight:700}
.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:var(--s4)}

/* Tables (simple) */
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap}
[dir="rtl"] table.t th{letter-spacing:0}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.money,table.t th.money{text-align:end;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t tfoot td{font-weight:700;border-top:1px solid var(--line-strong)}
table.t .input,table.t .select{min-height:38px}
@media (max-width:640px){
  table.stack-sm-table thead{display:none}
  table.stack-sm-table tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
  table.stack-sm-table td{border:0;padding:0;display:flex;flex-direction:column;gap:4px;min-width:0}
  table.stack-sm-table td[data-label]::before{content:attr(data-label);font-size:12px;color:var(--muted);font-weight:600}
  table.stack-sm-table td.full{grid-column:1/-1}
  table.stack-sm-table td.money{text-align:start}
  table.stack-sm-table tfoot tr{border-bottom:0}
}

/* =====================================================================
   BUDGET
   ===================================================================== */
.toolbar{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-bottom:var(--s4)}
.toolbar .select{width:auto;min-width:0;flex:0 1 auto;border-radius:var(--r-pill)}
.total-card{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr);margin-bottom:var(--s4)}
@media (min-width:760px){ .total-card{grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr));align-items:end} }
.total-input{font-family:var(--font-serif);font-size:30px;font-weight:600;min-height:54px;padding:4px 14px}
.stat .label{font-size:12.5px;color:var(--muted);font-weight:600}
.stat .value{font-size:20px;font-weight:600}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:var(--s3);box-shadow:var(--shadow-1);overflow:hidden;transition:box-shadow .2s,transform .2s}
.cat.dragging,.irow.dragging{opacity:.55}
.cat.drop-before{box-shadow:0 -3px 0 0 var(--accent)} .cat.drop-after{box-shadow:0 3px 0 0 var(--accent)}
.irow.drop-before{box-shadow:inset 0 3px 0 0 var(--accent)} .irow.drop-after{box-shadow:inset 0 -3px 0 0 var(--accent)}
.cat-head{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px 8px;align-items:center;padding:var(--s3) var(--s3)}
.cat-swatch{width:10px;height:10px;border-radius:3px;flex:none}
.cat-name{display:flex;align-items:center;gap:8px;min-width:0}
.cat-name .input{font-family:var(--font-serif);font-size:21px;font-weight:600;border-color:transparent;background:transparent;padding:2px 8px;min-height:38px}
[dir="rtl"] .cat-name .input{font-family:'Noto Naskh Arabic',var(--font-serif);font-size:18px}
.cat-name .input:hover{border-color:var(--line-strong)}
.cat-alloc{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) 84px auto;gap:8px;align-items:center}
.cat-alloc .input{min-height:38px}
.cat-meter{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}
.cat-meter .meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.pct-wrap{position:relative}
.pct-wrap .input{padding-inline-end:24px;text-align:end}
.pct-wrap::after{content:"%";position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.cat-del{grid-row:1;grid-column:4}
@media (min-width:900px){
  .cat-del{grid-row:auto;grid-column:auto}
  .cat-head{grid-template-columns:auto auto minmax(160px,1fr) minmax(180px,1.1fr) 150px 84px auto auto;padding:var(--s3) var(--s4)}
  .cat-alloc{grid-column:auto;display:contents}
  .cat-meter{grid-column:auto;order:0}
}
.handle{width:28px;height:36px;display:grid;place-items:center;border:0;background:transparent;color:var(--muted);border-radius:6px;cursor:grab;touch-action:none}
.handle:hover{background:var(--surface-2);color:var(--ink)}
.handle:active{cursor:grabbing}
.collapse-btn .i{transition:transform .2s var(--ease)}
.collapse-btn[aria-expanded="false"] .i{transform:rotate(-90deg)}
[dir="rtl"] .collapse-btn[aria-expanded="false"] .i{transform:rotate(90deg)}
.items{border-top:1px solid var(--line)}
.ihead{display:none}
.irow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px 10px;padding:var(--s3);border-bottom:1px solid var(--line);align-items:center;background:var(--surface)}
.irow:last-of-type{border-bottom:0}
.irow .c-handle{grid-row:1;grid-column:1}
.irow .c-name{grid-row:1;grid-column:2;min-width:0}
.irow .c-actions{grid-row:1;grid-column:3;display:flex;gap:2px}
.irow .fields{grid-row:2;grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
@media (min-width:600px){ .irow .fields{grid-template-columns:repeat(4,minmax(0,1fr))} }
.cell{min-width:0;display:flex;flex-direction:column;gap:3px}
.cell-label{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
[dir="rtl"] .cell-label{letter-spacing:0}
.cell .input,.cell .select{min-height:38px;padding:6px 10px;font-size:14px}
.cell .ro{min-height:38px;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;column-gap:6px;font-weight:600;padding:0 4px;font-size:13.5px;line-height:1.25;text-align:end;min-width:0;overflow-wrap:anywhere}
.cell .ro small{font-weight:500}
.c-name .input{font-weight:600;border-color:transparent;background:transparent;padding-inline:8px}
.c-name .input:hover{border-color:var(--line-strong)}
.c-name .sub{display:flex;flex-wrap:wrap;gap:6px;padding-inline:8px;margin-top:2px}
.add-item{display:flex;justify-content:flex-start;padding:var(--s2) var(--s3)}
@media (min-width:1140px){
  .ihead,.irow{display:grid;grid-template-columns:28px minmax(150px,2fr) repeat(4,minmax(88px,1fr)) minmax(92px,1fr) minmax(84px,.9fr) 112px 96px 76px;gap:8px;align-items:center}
  .ihead{padding:8px var(--s4);background:var(--surface-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
  [dir="rtl"] .ihead{letter-spacing:0}
  .ihead .r{text-align:end}
  .irow{padding:6px var(--s4)}
  .irow .c-handle,.irow .c-name,.irow .c-actions{grid-row:auto;grid-column:auto}
  .irow .fields{display:contents}
  .irow .cell-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  .irow .c-actions{justify-content:flex-end}
}
.cat.collapsed .items{display:none}
.var-chip{font-size:12px;font-weight:600}

/* =====================================================================
   PAYMENTS, CALENDAR, VENDORS, MISC
   ===================================================================== */
.month-group + .month-group{margin-top:var(--s5)}
.month-title{font-family:var(--font-serif);font-size:20px;font-weight:600;margin-bottom:var(--s2);display:flex;gap:8px;align-items:baseline}
.pay{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.pay.overdue{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));background:linear-gradient(90deg,var(--danger-soft),var(--surface) 40%)}
[dir="rtl"] .pay.overdue{background:linear-gradient(-90deg,var(--danger-soft),var(--surface) 40%)}
.pay.paid{opacity:.85}
.date-block{width:56px;height:56px;border-radius:var(--r);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.date-block .d{font-family:var(--font-serif);font-size:24px;font-weight:600}
.date-block .m{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:2px}
.pay .info{min-width:0}
.pay .info .title{font-weight:600}
.pay .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center;font-size:12.5px;color:var(--muted)}
.pay .amt{text-align:end;font-weight:700;font-size:16px}
.pay .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;border-top:1px dashed var(--line);padding-top:8px}
@media (min-width:760px){
  .pay{grid-template-columns:56px minmax(0,1fr) auto auto}
  .pay .acts{grid-column:auto;border:0;padding:0}
}
.totals-bar{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);padding:var(--s3) var(--s4);background:var(--surface-2);border-radius:var(--r);margin-bottom:var(--s4);font-size:14px}
.totals-bar b{font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.cal .dow{background:var(--surface-2);font-size:11.5px;font-weight:600;text-align:center;padding:8px 2px;color:var(--muted);text-transform:uppercase}
.cal .day{background:var(--surface);min-height:92px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal .day.out{background:var(--surface-2);color:var(--muted)}
.cal .day .n{font-size:12.5px;font-weight:600}
.cal .day.today .n{background:var(--accent);color:var(--accent-ink);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.cal .day.event{box-shadow:inset 0 0 0 2px var(--rose)}
.cal .ev{font-size:11.5px;border-radius:6px;padding:2px 6px;border:0;text-align:start;background:var(--accent-soft);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;font-weight:500}
.cal .ev.overdue{background:var(--danger-soft);color:var(--danger)}
.cal .ev.paid{background:var(--success-soft);color:var(--success)}
.cal .ev.soon{background:var(--warning-soft);color:var(--warning)}
@media (max-width:640px){
  .cal .day{min-height:54px;padding:4px}
  .cal .ev{font-size:0;height:8px;width:8px;padding:0;border-radius:50%}
  .cal .ev.paid{background:var(--success)} .cal .ev.overdue{background:var(--danger)} .cal .ev.soon{background:var(--warning)} .cal .ev{background:var(--accent)}
  .cal .evs{display:flex;flex-wrap:wrap;gap:3px}
}
.vcard{display:flex;flex-direction:column;gap:var(--s3)}
.vcard .top{display:flex;gap:12px;align-items:flex-start}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-serif);font-size:20px;font-weight:700;flex:none;background:var(--rose-soft);color:var(--ink)}
.vcard h3{font-size:21px;margin:0;overflow-wrap:anywhere}
.contact{display:flex;flex-wrap:wrap;gap:6px}
.contact a{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:var(--r-pill);background:var(--surface-2);color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;max-width:100%}
.contact a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.contact a:hover{background:var(--surface-3)}
.stars{display:inline-flex;gap:2px;color:var(--warning)}
.stars .i{width:16px;height:16px}
.stars .on{fill:currentColor}
.rating-input{display:flex;gap:4px}
.rating-input label{cursor:pointer;color:var(--line-strong);display:grid;place-items:center;width:36px;height:36px;border-radius:50%}
.rating-input input{position:absolute;opacity:0;pointer-events:none}
.rating-input label.on{color:var(--warning)}
.rating-input label.on .i{fill:currentColor}
.rating-input input:focus-visible + .i{outline:3px solid var(--focus);outline-offset:3px;border-radius:50%}
.quotes{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.quote{position:relative;display:flex;flex-direction:column;gap:var(--s3)}
.winner-card{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--shadow-2)}
.quote.winner{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--shadow-2)}
.quote .price{font-family:var(--font-serif);font-size:32px;font-weight:600;line-height:1}
.quote dl{margin:0;display:grid;gap:10px}
.quote dt{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
[dir="rtl"] .quote dt{letter-spacing:0}
.quote dd{margin:2px 0 0;white-space:pre-line;font-size:14px;overflow-wrap:anywhere}
.ribbon{position:absolute;top:12px;inset-inline-end:12px}
.scen-table td,.scen-table th{white-space:nowrap}
.delta{font-size:12px;font-weight:600;display:block}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;margin-bottom:12px}
.bar-row .progress{grid-column:1/-1}
.stack-bar{display:flex;height:16px;border-radius:var(--r-pill);overflow:hidden;background:var(--surface-3)}
.stack-bar span{display:block;height:100%;transition:width .7s var(--ease)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2);margin-top:var(--s3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px}
.legend-list{list-style:none;margin:var(--s3) 0 0;padding:0;display:grid;gap:6px 16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));font-size:13px}
.legend-list li{display:flex;align-items:center;gap:8px;min-width:0}
.legend-list .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend-list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.chart-box{position:relative;width:100%;min-width:0}
.chart-box canvas{max-width:100%}
.donut-fallback{width:180px;height:180px;border-radius:50%;margin:0 auto;position:relative}
.donut-fallback::after{content:"";position:absolute;inset:28%;border-radius:50%;background:var(--surface)}
.hbar{display:grid;grid-template-columns:minmax(0,120px) minmax(0,1fr);gap:4px 10px;align-items:center;font-size:12.5px;margin-bottom:6px}
.hbar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.hbar .bars{display:flex;flex-direction:column;gap:2px}
.hbar .bars span{display:block;height:7px;border-radius:4px}
.vbars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:8px}
.vbars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;min-width:0;height:100%;gap:0}
.vbars .col span{display:block;border-radius:4px 4px 0 0}
.vbars .col small{font-size:10.5px;color:var(--muted);text-align:center;margin-top:4px;white-space:nowrap;overflow:hidden}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:end;font-weight:600}
.gap-card{display:flex;flex-direction:column;gap:6px}
.gap-card .value{font-family:var(--font-serif);font-size:36px;font-weight:600;line-height:1.05}
.log-list{max-height:420px;overflow:auto}

/* =====================================================================
   DIALOG, WIZARD, TOAST
   ===================================================================== */
dialog{border:0;padding:0;border-radius:var(--r-lg);background:var(--surface);color:var(--ink);box-shadow:var(--shadow-3);width:min(640px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:var(--overlay);backdrop-filter:blur(2px)}
dialog[open]{animation:dlgIn .25s var(--ease)}
@keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.dlg-head h2{font-size:26px;flex:1}
.dlg-body{padding:var(--s5);overflow:auto;display:flex;flex-direction:column;gap:var(--s4)}
.dlg-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:var(--s2);padding:var(--s4) var(--s5);border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg)}
dialog.wide{width:min(860px,calc(100vw - 24px))}
@media (max-width:600px){
  dialog{width:100vw;max-width:100vw;max-height:100dvh;height:100dvh;border-radius:0;margin:0}
  .dlg{max-height:100dvh;height:100%}
  .dlg-body{flex:1;padding:var(--s4)}
  .dlg-head,.dlg-foot{padding:var(--s3) var(--s4)}
  .dlg-foot{border-radius:0;padding-bottom:calc(var(--s3) + env(safe-area-inset-bottom))}
}
.wizard-steps{display:flex;gap:6px;align-items:center}
.wizard-steps span{height:6px;flex:1;border-radius:3px;background:var(--surface-3);transition:background .3s}
.wizard-steps span.on{background:var(--accent)}
.type-grid{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:600px){ .type-grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.type-card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);text-align:start;min-height:92px}
.type-card:hover{border-color:var(--accent)}
.type-card[aria-checked="true"]{border-color:var(--accent);background:var(--accent-tint);box-shadow:0 0 0 2px var(--accent)}
.type-card .emoji{font-size:24px;line-height:1}
.type-card b{font-weight:600}
.type-card small{color:var(--muted);font-size:12px}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px}
.toasts{position:fixed;z-index:60;inset-inline:0;bottom:calc(var(--bottombar-h) + 12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
@media (min-width:960px){ .toasts{bottom:24px} }
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:var(--r);box-shadow:var(--shadow-3);max-width:min(520px,100%);font-size:14px;animation:toastIn .3s var(--ease)}
.toast .msg{flex:1}
.toast button{background:transparent;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg);border-radius:var(--r-pill);min-height:34px;padding:0 14px;font-weight:600;font-size:13px}
.toast button:focus-visible{outline-color:var(--bg)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(10px);transition:all .25s}

/* =====================================================================
   PRINT
   ===================================================================== */
#print-root{display:none}
@page{size:A4;margin:14mm 12mm}
@media print{
  :root{--bg:#fff;--surface:#fff;--ink:#111;--muted:#555;--line:#ccc}
  body{background:#fff;color:#111;font-size:10.5pt}
  #app,.topbar,.bottom-nav,.toasts,dialog,.skip-link{display:none!important}
  #print-root{display:block}
  .p-page{page-break-after:always;break-after:page}
  .p-page:last-child{page-break-after:auto;break-after:auto}
  .p-head{border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px}
  .p-head h1{font-size:26pt}
  .p-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 18px}
  .p-kpis div{border:1px solid #bbb;border-radius:6px;padding:8px}
  .p-kpis b{display:block;font-size:13pt}
  .p-kpis span{font-size:8.5pt;color:#555;text-transform:uppercase}
  table.p{width:100%;border-collapse:collapse;font-size:9pt;margin-bottom:10px}
  table.p th{background:#f0ede7;text-align:start;padding:5px 6px;border-bottom:1px solid #999;font-size:8pt;text-transform:uppercase}
  table.p td{padding:4px 6px;border-bottom:1px solid #ddd;vertical-align:top}
  table.p .m{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
  table.p tr{page-break-inside:avoid;break-inside:avoid}
  table.p tr.cat td{background:#f7f5f0;font-weight:700;border-top:1px solid #999}
  h2.p-h{font-size:16pt;margin:14px 0 8px}
  .env-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10mm}
  .env{border:1.5px dashed #555;border-radius:4mm;padding:6mm;min-height:52mm;break-inside:avoid;page-break-inside:avoid;display:flex;flex-direction:column;gap:2mm}
  .env h3{font-size:16pt;margin:0}
  .env .amt{font-size:20pt;font-weight:700;margin-top:auto}
  .p-foot{margin-top:12px;font-size:8pt;color:#777}
}

/* =====================================================================
   MOTION
   ===================================================================== */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
/* =====================================================================
   DEMO BANNER
   ===================================================================== */
.demo-banner{background:var(--ink);color:var(--bg);font-size:13.5px;line-height:1.4}
.demo-inner{max-width:var(--maxw);margin:0 auto;padding:8px var(--s4);display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;background:var(--bg);color:var(--ink);font-weight:700;font-size:11.5px;letter-spacing:.12em;padding:3px 10px;border-radius:var(--r-pill);flex:none}
[dir="rtl"] .demo-tag{letter-spacing:0}
.demo-text{min-width:0;flex:1 1 320px}
.demo-text .short{display:none}
.demo-meter{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-inline-start:auto;font-weight:600;font-variant-numeric:tabular-nums}
.demo-bar{width:96px;height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden;flex:none}
.demo-bar span{display:block;height:100%;background:var(--bg);border-radius:inherit;transition:width .5s var(--ease)}
.demo-meter.full .demo-bar span{background:#F4A39B}
.demo-sep{opacity:.5}
@media (max-width:640px){
  .demo-inner{padding:6px var(--s3);font-size:12.5px;gap:4px 10px}
  .demo-text{flex:1 1 auto}
  .demo-text .long{display:none}
  .demo-text .short{display:inline}
  .demo-bar{width:56px}
}
@media print{ .demo-banner{display:none!important} }

function emptyRoot(){

/* Upgrade any older saved shape to the current schema. Never drops user data. */
function migrate(d){
  if(!d || typeof d !== 'object' || typeof d.events !== 'object' || d.events === null) return null;
  let v = Number(d.version) || 1;
  if(v < 2){
    // v1 stored a single guest number; v2 has min / expected / max scenarios
    Object.values(d.events).forEach(e => {
      if(e && !e.guests){
        const n = Number(e.guestCount) || 0;
        e.guests = { min:Math.round(n*0.85), expected:n, max:Math.round(n*1.15), useList:false };
        delete e.guestCount;
      }
    });
    v = 2;
  }
  d.version = SCHEMA_VERSION;
  d.prefs = Object.assign({ theme:'auto', lang:'en' }, d.prefs || {});
  Object.keys(d.events).forEach(id => { if(!d.events[id] || typeof d.events[id] !== 'object') delete d.events[id]; else normalizeEvent(d.events[id], id); });
  if(!d.events[d.activeEventId]) d.activeEventId = Object.keys(d.events)[0] || null;
  return d;
}
/* Fill missing fields only, so export → import round-trips identically. */
function normalizeEvent(e, id){
  const def = { id, name:'Event', type:'custom', date:addDays(todayISO(),180), location:'', currency:'EUR', customSymbol:'',
    numberFormat:'en-US', totalBudget:0, contingencyPct:8, priorities:[], sideNames:['A','B'],
    categories:[], items:[], payments:[], vendors:[], quotes:[], contributors:[], guestList:[], scenarios:[], activeScenarioId:null, log:[] };
  for(const k in def) if(e[k] === undefined) e[k] = def[k];
  if(!e.guests) e.guests = { min:0, expected:0, max:0, useList:false };
  if(!e.scenarios.length){ const s = { id:uid(), name:'Realistic', data:null }; e.scenarios.push(s); e.activeScenarioId = s.id; }
  if(!e.scenarios.some(s => s.id === e.activeScenarioId)) e.activeScenarioId = e.scenarios[0].id;
  return e;
}

/* ---------- Event factory ---------- */
function newEvent(o = {}){
  const type = TEMPLATES[o.type] ? o.type : 'wedding';
  const expected = o.guests ?? 100;
  const e = normalizeEvent({
    id:uid(), name:o.name || t('type.'+type), type, date:o.date || addDays(todayISO(), 240), location:o.location || '',
    currency:o.currency || 'EUR', customSymbol:o.customSymbol || '', numberFormat:o.numberFormat || 'en-US',
    totalBudget:o.totalBudget ?? 2500000, contingencyPct:o.contingencyPct ?? 8, priorities:o.priorities || [],
    guests:{ min:Math.round(expected*0.85), expected, max:Math.round(expected*1.15), useList:false },
    sideNames:[t('guests.sideA'), t('guests.sideB')],
    scenarios:[{ id:uid(), name:t('scen.realistic'), data:null }],
    createdAt:new Date().toISOString()
  }, null);
  e.id = e.id || uid();
  e.activeScenarioId = e.scenarios[0].id;
  e.categories = buildCategories(type, e.priorities, e.contingencyPct);
  return e;
}
/* Template → categories. Priority picks get +20% weight, contingency is pinned to its %. */
function buildCategories(type, priorities = [], contPct = 8){
  const tpl = TEMPLATES[type] || TEMPLATES.custom;
  const cats = tpl.map(([key,pct]) => ({ id:uid(), key, name:t('cat.'+key), weight:pct * (priorities.includes(key) ? 1.2 : 1), locked:false, lockedAmount:0, collapsed:false }));
  const cont = cats.find(c => c.key === 'contingency');
  const others = cats.filter(c => c !== cont);
  const os = others.reduce((s,c) => s + c.weight, 0) || 1;
  const cp = clamp(Number(contPct) || 0, 0, 50);
  others.forEach(c => c.weight = round4(c.weight / os * (cont ? 100 - cp : 100)));
  if(cont) cont.weight = cp;
  return cats;
}

/* Parse user text into minor units. Returns NaN when not a number. */
function parseMoney(str){
  if(typeof str === 'number') return Math.round(str * 100);
  let s = String(str ?? '').trim()
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0))
    .replace(/٫/g, decimalSep()).replace(/٬/g, '');
  if(!s) return 0;
  s = s.replace(/[\s  '’]/g, '').replace(/[−–]/g, '-').replace(/[^\d.,-]/g, '');
  const dec = decimalSep();
  if(dec === ','){ s = s.replace(/\./g, '').replace(',', '.'); }
  else { // tolerate a single comma used as decimal (e.g. "12,5") when no dot is present

function headcount(e){
  if(e.guests.useList && e.guestList.length){
    return sum(e.guestList.filter(g => g.rsvp !== 'no'), g => (Number(g.adults) || 0) + (Number(g.children) || 0));
  }
  return Math.max(0, Number(e.guests.expected) || 0);
}
function itemVal(it, field, hc){ const v = Number(it[field]) || 0; return it.perHead ? v * hc : v; }
function signedPay(p){ return p.type === 'refund' ? -(p.amount || 0) : (p.amount || 0); }
function payStatus(p, today = todayISO()){
  if(p.paidDate) return 'paid';
  if(p.due && p.due < today) return 'overdue';
  if(p.due && daysBetween(today, p.due) <= 14) return 'soon';
  return 'upcoming';
}
/* Split total among categories: locked keep their amount, others share the rest by weight.
   Largest-remainder rounding guarantees the parts sum exactly to the total. */
function allocation(e){
  const out = new Map();
  const total = Math.max(0, e.totalBudget || 0);
  const locked = e.categories.filter(c => c.locked);
  const unl = e.categories.filter(c => !c.locked);
  locked.forEach(c => out.set(c.id, Math.max(0, c.lockedAmount || 0)));
  const avail = Math.max(0, total - sum(locked, c => c.lockedAmount));
  const ws = sum(unl, c => Math.max(0, c.weight || 0));
  // split in whole currency units; leftover cents go to the largest share
  const units = Math.floor(avail / 100), cents = avail - units * 100;
  const raw = unl.map(c => units * (ws > 0 ? Math.max(0, c.weight || 0) / ws : 1 / unl.length));
  const floors = raw.map(Math.floor);
  let rem = units - sum(floors);
  raw.map((r,i) => [r - floors[i], i]).sort((a,b) => b[0] - a[0]).forEach(([,i]) => { if(rem > 0){ floors[i]++; rem--; } });
  let big = 0; floors.forEach((f,i) => { if(f > floors[big]) big = i; });
  unl.forEach((c,i) => out.set(c.id, (floors[i] || 0) * 100 + (i === big ? cents : 0)));
  return out;
}
function contractedOf(it, hc){ return itemVal(it,'actual',hc) || itemVal(it,'quote',hc) || itemVal(it,'estimate',hc); }

function computeAll(e){
  const today = todayISO();
  const hc = headcount(e);
  const alloc = allocation(e);
  const paidBy = new Map();
  for(const p of e.payments) if(p.paidDate) paidBy.set(p.itemId, (paidBy.get(p.itemId) || 0) + signedPay(p));
  const items = new Map(), cats = new Map();
  e.categories.forEach(c => cats.set(c.id, { alloc:alloc.get(c.id) || 0, est:0, forecast:0, committed:0, paid:0, count:0 }));
  let forecast = 0, committed = 0, paid = 0, estimate = 0;
  for(const it of e.items){
    const est = itemVal(it,'estimate',hc), q = itemVal(it,'quote',hc), a = itemVal(it,'actual',hc);
    const contracted = a || q || est;
    const ip = paidBy.get(it.id) || 0;
    const com = (it.status === 'booked' || it.status === 'paid') ? contracted : 0;
    items.set(it.id, { est, q, a, contracted, paid:ip, balance:contracted - ip, variance:contracted - est, variancePct:est ? (contracted - est) / est : null, committed:com });
    const cc = cats.get(it.catId);
    if(cc){ cc.est += est; cc.forecast += contracted; cc.committed += com; cc.paid += ip; cc.count++; }
    forecast += contracted; committed += com; paid += ip; estimate += est;
  }
  // payments linked to removed items still count as money out
  for(const [id, v] of paidBy) if(!items.has(id)) paid += v;
  cats.forEach(c => c.ratio = c.alloc ? c.forecast / c.alloc : (c.forecast > 0 ? Infinity : 0));
  const budget = e.totalBudget || 0;
  const contCat = e.categories.find(c => c.key === 'contingency');
  let contUsed = 0;
  e.categories.forEach(c => { const cc = cats.get(c.id); if(c === contCat) contUsed += cc.forecast; else contUsed += Math.max(0, cc.forecast - cc.alloc); });
  const contAlloc = contCat ? cats.get(contCat.id).alloc : 0;
  const pays = e.payments.map(p => ({ p, st:payStatus(p, today) }));
  const overdue = pays.filter(x => x.st === 'overdue');
  const soon = pays.filter(x => x.st === 'soon');
  const overpaid = e.items.filter(it => { const x = items.get(it.id); return x.paid > x.contracted && x.paid > 0; });
  const lockedSum = sum(e.categories.filter(c => c.locked), c => c.lockedAmount);
  const totals = { budget, allocated:forecast, forecast, committed, paid, estimate, remaining:budget - forecast, toPay:Math.max(0, forecast - paid), perGuest:hc ? Math.round(forecast / hc) : 0 };
  const res = { today, hc, alloc, items, cats, totals, overdue, soon, overpaid, lockedOver:lockedSum > budget,
    cont:{ cat:contCat, alloc:contAlloc, used:contUsed, pct:contAlloc ? contUsed / contAlloc : (contUsed > 0 ? 1 : 0) } };
  res.health = computeHealth(e, res);
  return res;
}
function computeHealth(e, r){
  const T = r.totals;
  if(T.budget > 0 && T.forecast > T.budget) return { level:'over', reason:t('health.overBy', { amt:fmtMoney(T.forecast - T.budget) }) };
  const overCats = e.categories.filter(c => r.cats.get(c.id).ratio > 1 && c.key !== 'contingency');
  if(r.overdue.length) return { level:'watch', reason:t('health.overdue', { n:r.overdue.length }) };
  if(r.cont.alloc && r.cont.pct > 0.75) return { level:'watch', reason:t('health.contUsed', { pct:fmtPct(r.cont.pct) }) };
  if(overCats.length) return { level:'watch', reason:t('health.catsOver', { n:overCats.length, name:overCats[0].name }) };
  if(T.budget > 0 && T.forecast / T.budget > 0.95) return { level:'watch', reason:t('health.near', { pct:fmtPct(T.forecast / T.budget) }) };
  return { level:'ok', reason:t('health.ok', { amt:fmtMoney(Math.max(0, T.remaining)) }) };
}
/* Rule-based insights, most urgent first */
function computeInsights(e, r){
  const out = [];
  const T = r.totals;
  if(r.overdue.length) out.push({ tone:'danger', icon:'alert', text:t('ins.overdue', { n:r.overdue.length, amt:fmtMoney(sum(r.overdue, x => signedPay(x.p))) }) });
  const week = r.soon.filter(x => daysBetween(r.today, x.p.due) <= 7);
  if(week.length) out.push({ tone:'warning', icon:'calendar', text:t('ins.dueWeek', { n:week.length, amt:fmtMoney(sum(week, x => signedPay(x.p))) }) });
  e.categories.forEach(c => {
    const cc = r.cats.get(c.id);
    if(cc.est > 0 && cc.forecast > cc.est * 1.05) out.push({ tone:'warning', icon:'trend', text:t('ins.overEstimate', { name:c.name, pct:fmtPct((cc.forecast - cc.est) / cc.est) }) });
    else if(c.key !== 'contingency' && cc.alloc > 0 && cc.ratio > 1) out.push({ tone:'warning', icon:'trend', text:t('ins.overAlloc', { name:c.name, amt:fmtMoney(cc.forecast - cc.alloc) }) });
  });
  if(r.cont.alloc) out.push({ tone:r.cont.pct > 0.75 ? 'danger' : r.cont.pct > 0.4 ? 'warning' : 'success', icon:'shield', text:t('ins.contingency', { pct:fmtPct(r.cont.pct), amt:fmtMoney(Math.max(0, r.cont.alloc - r.cont.used)) }) });
  r.overpaid.forEach(it => out.push({ tone:'danger', icon:'alert', text:t('ins.overpaid', { name:it.name }) }));
  const days = daysBetween(r.today, e.date);
  const ideas = e.items.filter(it => it.status === 'idea');
  if(days <= 120 && days >= 0 && ideas.length) out.push({ tone:'info', icon:'sparkle', text:t('ins.ideas', { n:ideas.length, days }) });
  const funds = sum(e.contributors, c => c.received);
  if(e.contributors.length && T.committed > funds) out.push({ tone:'info', icon:'coins', text:t('ins.funding', { amt:fmtMoney(T.committed - funds) }) });
  if(T.budget > 0 && T.forecast <= T.budget && !r.overdue.length) out.push({ tone:'success', icon:'check', text:t('ins.under', { amt:fmtMoney(T.budget - T.forecast) }) });
  if(!e.items.length) out.push({ tone:'info', icon:'sparkle', text:t('ins.start') });
  return out.slice(0, 7);
}
function snapshot(e){ const d = {}; SCEN_FIELDS.forEach(f => d[f] = clone(e[f])); return d; }
function scenarioEvent(e, s){ return (s.id === e.activeScenarioId || !s.data) ? e : Object.assign({}, e, clone(s.data)); }
function catColor(i){ const pal = isDark() ? PALETTE_DARK : PALETTE_LIGHT; return pal[i % pal.length]; }
function isDark(){
  const th = state?.prefs?.theme || 'auto';
  if(th === 'dark') return true; if(th === 'light') return false;
  try { return window.matchMedia('(prefers-color-scheme: dark)').matches; } catch(_){ return false; }
}
function itemLabel(e, itemId){ const it = byId(e.items, itemId); return it ? it.name : t('pay.removedItem'); }
function vendorOfItem(e, itemId){ const it = byId(e.items, itemId); return it && it.vendorId ? byId(e.vendors, it.vendorId) : null; }

/* =====================================================================
   REDUCERS — every mutation goes through dispatch()
   ===================================================================== */
function logChange(e, what, from, to){
  if(String(from) === String(to)) return;
  e.log.unshift({ t:new Date().toISOString(), what, from:String(from ?? ''), to:String(to ?? '') });
  if(e.log.length > MAX_LOG) e.log.length = MAX_LOG;
}
function moneyStr(v){ return fmtMoney(v || 0); }
/* Set one category to an amount; other unlocked categories rebalance proportionally. */
function setCategoryAmount(e, catId, amount){
  const cat = byId(e.categories, catId); if(!cat) return false;
  const total = e.totalBudget || 0;
  if(cat.locked){
    const otherLocked = sum(e.categories.filter(c => c.locked && c !== cat), c => c.lockedAmount);
    cat.lockedAmount = clamp(amount, 0, Math.max(0, total - otherLocked));
    return true;
  }
  const unl = e.categories.filter(c => !c.locked);
  if(unl.length < 2) return false;
  const avail = Math.max(0, total - sum(e.categories.filter(c => c.locked), c => c.lockedAmount));
  const amt = clamp(amount, 0, avail);
  const cur = allocation(e);
  const others = unl.filter(c => c !== cat);
  const oSum = sum(others, c => cur.get(c.id));
  const rest = avail - amt;
  others.forEach(c => c.weight = oSum > 0 ? cur.get(c.id) / oSum * rest : rest / others.length);
  cat.weight = amt;
  return true;
}
function payload(it, fields){ const o = {}; fields.forEach(f => { if(it[f] !== undefined) o[f] = it[f]; }); return o; }

const R = {
  'event/set'(e, { field, value }){
    const old = e[field]; e[field] = value;
    if(field === 'date') logChange(e, t('log.eventDate'), fmtDate(old), fmtDate(value));
    if(field === 'name') logChange(e, t('log.eventName'), old, value);
    if(field === 'currency' || field === 'numberFormat') nfCache.clear();
  },
  'budget/total'(e, { value }){ const old = e.totalBudget; e.totalBudget = value; logChange(e, t('log.total'), moneyStr(old), moneyStr(value)); },
  'budget/contingency'(e, { pct }){
    const cont = e.categories.find(c => c.key === 'contingency');
    const old = e.contingencyPct; e.contingencyPct = pct;
    if(cont) setCategoryAmount(e, cont.id, Math.round((e.totalBudget || 0) * pct / 100));
    logChange(e, t('log.contingency'), old + '%', pct + '%');
  },
  'guests/set'(e, { field, value }){ const old = e.guests[field]; e.guests[field] = value; logChange(e, t('log.guests', { which:t('guests.' + field) }), old, value); },
  'guests/useList'(e, { value }){ e.guests.useList = value; },
  'guests/sideName'(e, { i, value }){ e.sideNames[i] = value; },
  'guest/add'(e, g){ e.guestList.push(Object.assign({ id:uid(), name:'', side:'both', adults:1, children:0, rsvp:'pending' }, g)); },
  'guest/update'(e, { id, field, value }){ const g = byId(e.guestList, id); if(g) g[field] = value; },
  'guest/delete'(e, { id }){ e.guestList = e.guestList.filter(g => g.id !== id); },

  'cat/add'(e, { name }){ const c = { id:uid(), key:'custom', name, weight:0, locked:false, lockedAmount:0, collapsed:false }; e.categories.push(c); logChange(e, t('log.catAdded'), '', name); return c.id; },
  'cat/rename'(e, { id, name }){ const c = byId(e.categories, id); if(c){ logChange(e, t('log.catRenamed'), c.name, name); c.name = name; } },
  'cat/delete'(e, { id }){
    const c = byId(e.categories, id); if(!c) return;
    const itemIds = new Set(e.items.filter(i => i.catId === id).map(i => i.id));
    e.items = e.items.filter(i => i.catId !== id);
    e.payments = e.payments.filter(p => !itemIds.has(p.itemId));
    e.categories = e.categories.filter(x => x.id !== id);
    if(e.categories.length && !e.categories.some(x => !x.locked)) e.categories[0].locked = false;
    logChange(e, t('log.catDeleted'), c.name, '');
  },
  'cat/setAmount'(e, { id, amount }){
    const c = byId(e.categories, id); const before = allocation(e).get(id);
    const ok = setCategoryAmount(e, id, amount);
    if(ok) logChange(e, t('log.catAlloc', { name:c.name }), moneyStr(before), moneyStr(allocation(e).get(id)));
    return ok;
  },
  'cat/lock'(e, { id, locked }){
    const c = byId(e.categories, id); if(!c) return false;
    const cur = allocation(e);
    if(locked){
      if(e.categories.filter(x => !x.locked).length < 2) return false;
      c.locked = true; c.lockedAmount = cur.get(id) || 0;
    } else {
      c.locked = false;
      e.categories.filter(x => !x.locked).forEach(x => x.weight = cur.get(x.id) || 0);
    }
    return true;
  },
  'cat/toggle'(e, { id }){ const c = byId(e.categories, id); if(c) c.collapsed = !c.collapsed; },
  'cat/collapseAll'(e, { value }){ e.categories.forEach(c => c.collapsed = value); },
  'cat/move'(e, { id, beforeId }){
    const c = byId(e.categories, id); if(!c || id === beforeId) return;
    e.categories = e.categories.filter(x => x !== c);
    const idx = beforeId ? e.categories.findIndex(x => x.id === beforeId) : -1;
    if(idx < 0) e.categories.push(c); else e.categories.splice(idx, 0, c);
  },

  'item/add'(e, data){
    const it = Object.assign({ id:uid(), catId:e.categories[0]?.id, name:t('budget.newItem'), estimate:0, quote:0, actual:0, perHead:false,
      estimateLocked:false, status:'idea', priority:'nice', vendorId:'', notes:'' }, data);
    e.items.push(it);
    logChange(e, t('log.itemAdded'), '', it.name);
    return it.id;
  },
  'item/update'(e, { id, field, value }){
    const it = byId(e.items, id); if(!it) return;
    const old = it[field]; it[field] = value;
    if((field === 'quote' || field === 'actual') && value > 0 && it.estimate > 0) it.estimateLocked = true;
    if(field === 'quote' && value > 0 && it.status === 'idea') it.status = 'quoted';
    const money = ['estimate','quote','actual'].includes(field);
    const lab = t('budget.col.' + field) || field;
    logChange(e, it.name + ' · ' + lab, money ? moneyStr(old) : (field === 'status' ? t('status.' + old) : field === 'priority' ? t('prio.' + old) : old), money ? moneyStr(value) : (field === 'status' ? t('status.' + value) : field === 'priority' ? t('prio.' + value) : value));
  },
  'item/save'(e, { id, data }){
    const it = byId(e.items, id); if(!it) return;
    ['estimate','quote','actual'].forEach(f => { if(data[f] !== undefined && data[f] !== it[f]) logChange(e, (data.name || it.name) + ' · ' + t('budget.col.' + f), moneyStr(it[f]), moneyStr(data[f])); });
    Object.assign(it, data);
  },
  'item/delete'(e, { id }){
    const it = byId(e.items, id); if(!it) return;
    e.items = e.items.filter(x => x.id !== id);
    e.payments = e.payments.filter(p => p.itemId !== id);
    logChange(e, t('log.itemDeleted'), it.name, '');
  },
  'item/move'(e, { id, catId, beforeId }){

    e.items = e.items.filter(x => x !== it);
    if(catId && catId !== it.catId){ const c = byId(e.categories, catId); logChange(e, it.name, byId(e.categories, it.catId)?.name, c?.name); it.catId = catId; }
    const idx = beforeId ? e.items.findIndex(x => x.id === beforeId) : -1;

  },
  /* Editing "Paid" in the table records a dated adjustment payment so paid + balance stays exact */
  'item/setPaid'(e, { id, amount, current }){

    const diff = amount - current; if(!diff) return;
    e.payments.push({ id:uid(), itemId:id, type:diff > 0 ? 'installment' : 'refund', amount:Math.abs(diff), due:todayISO(), paidDate:todayISO(), method:'transfer', ref:t('pay.fromBudget'), note:'' });

  'pay/save'(e, { data }){

    if(ex){ Object.assign(ex, data); }
    else { data.id = uid(); e.payments.push(data); }

  },
  'pay/delete'(e, { id }){ const p = byId(e.payments, id); e.payments = e.payments.filter(x => x.id !== id); if(p) logChange(e, t('log.payDeleted', { name:itemLabel(e, p.itemId) }), fmtMoney(signedPay(p)), ''); },
  'pay/markPaid'(e, { id, date, unpaid }){
