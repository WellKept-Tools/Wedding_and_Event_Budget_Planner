/* ---------- Entry counting & limit ---------- */
function eventEntries(e){ return e.items.length + e.payments.length + e.vendors.length + e.quotes.length + e.guestList.length + e.contributors.length; }
function demoCount(root = state){ return Object.values((root && root.events) || {}).reduce((n, e) => n + eventEntries(e), 0); }
function demoLeft(){ return Math.max(0, DEMO.limit - demoCount()); }
let demoSuppress = false;
function demoLimitHit(){
  if($('#dlg').open) closeDialog();   // toasts render below modal dialogs
  toast(t('demo.limitReached', { n:DEMO.limit }));
  demoSuppress = true; setTimeout(() => { demoSuppress = false; }, 0);   // hide the action's own success toast
  return false;
}
function demoGuard(){ return demoLeft() > 0 || demoLimitHit(); }

/* Keep a generated event (sample data) within the remaining allowance. */
function demoTrim(e, cap){
  cap = Math.max(0, cap);
  if(eventEntries(e) <= cap) return;
  const q = { items:Math.round(cap * 0.4), payments:Math.round(cap * 0.3), vendors:Math.round(cap * 0.15), quotes:Math.round(cap * 0.1) };
  q.contributors = Math.max(0, cap - q.items - q.payments - q.vendors - q.quotes);
  const order = ['booked','paid','quoted','idea'];
  const rank = it => (it.vendorId ? 0 : 10) + order.indexOf(it.status);
  const keepItems = new Set(e.items.slice().sort((a,b) => rank(a) - rank(b)).slice(0, q.items).map(i => i.id));
  e.items = e.items.filter(i => keepItems.has(i.id));
  const today = todayISO(), pr = p => ({ overdue:0, soon:1, paid:2, upcoming:3 })[payStatus(p, today)];
  const keepPays = new Set(e.payments.filter(p => keepItems.has(p.itemId)).sort((a,b) => pr(a) - pr(b)).slice(0, q.payments).map(p => p.id));
  e.payments = e.payments.filter(p => keepPays.has(p.id));
  const linked = new Set(e.items.map(i => i.vendorId).filter(Boolean));
  const keepV = new Set(e.vendors.slice().sort((a,b) => (linked.has(a.id) ? 0 : 1) - (linked.has(b.id) ? 0 : 1)).slice(0, q.vendors).map(v => v.id));
  e.vendors = e.vendors.filter(v => keepV.has(v.id));
  e.items.forEach(i => { if(i.vendorId && !keepV.has(i.vendorId)) i.vendorId = ''; });
  e.quotes = e.quotes.slice().sort((a,b) => (b.winner ? 1 : 0) - (a.winner ? 1 : 0)).slice(0, q.quotes);
  e.contributors = e.contributors.slice(0, q.contributors);
  e.guestList = e.guestList.slice(0, Math.max(0, cap - eventEntries(Object.assign({}, e, { guestList:[] }))));
  const guestIds = new Set(e.guestList.map(g => g.id));
  e.scenarios.forEach(s => { if(s.data){ s.data.items = s.data.items.filter(i => keepItems.has(i.id)); s.data.guestList = (s.data.guestList || []).filter(g => guestIds.has(g.id)); } });
}

/* Every mutation: run it, and roll back if it pushes the total past the cap. */
const _dispatch = dispatch;
dispatch = function(type, payload = {}, opts = {}){
  const before = demoCount(), snap = JSON.stringify(state), undoLen = undoStack.length;
  const res = _dispatch(type, payload, Object.assign({}, opts, { render:false }));
  const after = demoCount();
  if(after > DEMO.limit && after > before){
    state = JSON.parse(snap); undoStack.length = undoLen; nfCache.clear();
    scheduleSave(); render();
    return demoLimitHit();
  }
  if(opts.render !== false) render();
  return res;
};
const _toast = toast;
toast = function(msg, o){ if(!demoSuppress) _toast(msg, o); };

/* Block "add" entry points up front, before a form is filled in. */
['item-add','contrib-add'].forEach(k => { const fn = ACT[k]; ACT[k] = (el, ev) => demoGuard() && fn(el, ev); });
{ const fn = FORMS['guest-add']; FORMS['guest-add'] = form => demoGuard() && fn(form); }
const _openPayment = openPaymentDialog;
openPaymentDialog = function(o = {}){ if(!o.id && !demoGuard()) return; return _openPayment(o); };
const _openSchedule = openScheduleDialog;
openScheduleDialog = function(id){ if(!demoGuard()) return; return _openSchedule(id); };
const _openVendor = openVendorDialog;
openVendorDialog = function(id){ if(!id && !demoGuard()) return; return _openVendor(id); };
const _openQuote = openQuoteDialog;
openQuoteDialog = function(id){ if(!id && !demoGuard()) return; return _openQuote(id); };
const _addEvent = addEvent;
addEvent = function(e){ demoTrim(e, DEMO.limit - demoCount()); return _addEvent(e); };
const _import = importJSONFile;
importJSONFile = async function(file){
  if(!file) return;
  let d = null; try { d = migrate(JSON.parse(await file.text())); } catch(_){ d = null; }
  if(d && demoCount(d) > DEMO.limit){ toast(t('demo.importTooBig', { n:demoCount(d), limit:DEMO.limit })); return; }
  return _import(file);
};

/* ---------- 7-day expiry ---------- */
let demoStart = Date.now();
let demoNotice = false;
function demoReadMeta(){ try { return JSON.parse(window.localStorage.getItem(DEMO.metaKey)); } catch(_){ return null; } }
function demoStartClock(){ demoStart = Date.now(); try { window.localStorage.setItem(DEMO.metaKey, JSON.stringify({ startedAt:demoStart })); } catch(_){} }
function demoExpiresAt(){ return demoStart + DEMO.days * DAY_MS; }
function demoWipe(){ Store.clear(); try { window.localStorage.removeItem(DEMO.metaKey); } catch(_){} }
function demoCheckExpiry(){
  if(Date.now() < demoExpiresAt()) return;
  demoWipe(); demoStartClock();
  const prefs = state.prefs; state = emptyRoot(); state.prefs = prefs;
  undoStack.length = 0; demoNotice = true;
  closeDialog(); destroyCharts(); render(); openWizard(true);
}
const _init = init;
init = function(){
  const m = demoReadMeta();
  if(m && m.startedAt){
    if(Date.now() >= m.startedAt + DEMO.days * DAY_MS){ demoWipe(); demoStartClock(); demoNotice = true; }
    else demoStart = m.startedAt;
  } else demoStartClock();
  _init();
  setInterval(demoCheckExpiry, 60000);
  document.addEventListener('visibilitychange', () => { if(!document.hidden) demoCheckExpiry(); });
};
const _renderWizard = renderWizard;
renderWizard = function(){
  _renderWizard();
  if(demoNotice && W.step === 0){
    const body = $('#wizard .dlg-body');
    if(body) body.insertAdjacentHTML('afterbegin', `<div class="alert warning" role="alert">${icon('alert')}<div>${esc(t('demo.expiredNotice', { days:DEMO.days }))}</div></div>`);
  }
};
const _finishWizard = finishWizard;
finishWizard = function(skip){ demoNotice = false; return _finishWizard(skip); };

/* ---------- Banner ---------- */
function demoUpdateBanner(){
  const b = $('#demoBanner'); if(!b) return;
  const used = demoCount();
  const ms = demoExpiresAt() - Date.now();
  const days = Math.ceil(ms / DAY_MS);
  const date = dtf({ dateStyle:'medium' }).format(new Date(demoExpiresAt()));
  b.setAttribute('aria-label', t('demo.aria'));
  b.querySelector('.demo-tag').textContent = t('demo.tag');
  b.querySelector('.long').textContent = t('demo.text', { limit:DEMO.limit, days:DEMO.days });
  b.querySelector('.short').textContent = t('demo.short');
  const meter = b.querySelector('.demo-meter');
  meter.classList.toggle('full', used >= DEMO.limit);
  meter.title = t('demo.entriesHelp');
  b.querySelector('.demo-bar span').style.width = Math.min(100, used / DEMO.limit * 100) + '%';
  b.querySelector('.demo-count').textContent = t('demo.usage', { used:fmtInt(used), limit:DEMO.limit });
  const exp = b.querySelector('.demo-expiry');
  exp.textContent = (ms < DAY_MS ? t('demo.expiresToday') : t('demo.expiresIn', { n:days })) + ' (' + date + ')';
  if(!document.title.endsWith(' — ' + t('demo.title'))) document.title += ' — ' + t('demo.title');
}
const _render = render;
render = function(){ _render(); demoUpdateBanner(); };

/* =====================================================================
   INIT
   ===================================================================== */
function init(){
  state = migrate(Store.load()) || emptyRoot();
  applyPrefs();
  ui.tab = tabFromHash();
  bindEvents();
  render();
  if(!ev()) openWizard(true);
  if(!ui.storageOk) setTimeout(() => toast(t('toast.storageOff')), 400);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
