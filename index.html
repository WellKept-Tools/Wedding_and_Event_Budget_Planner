const TABS = [
  { id:'dashboard', icon:'dashboard' }, { id:'budget', icon:'wallet' }, { id:'payments', icon:'card' },
  { id:'vendors', icon:'store' }, { id:'guests', icon:'users' }, { id:'funding', icon:'coins' }, { id:'settings', icon:'sliders' }
];
const VIEWS = {};
const AFTER = {};

/* ---------- tiny HTML helpers ---------- */
function attrs(o){ return Object.entries(o || {}).filter(([,v]) => v !== undefined && v !== null && v !== false).map(([k,v]) => v === true ? ` ${k}` : ` ${k}="${esc(v)}"`).join(''); }
function inp(o){
  return `<input class="input ${o.cls || ''}"${attrs({ type:o.type || 'text', id:o.id, inputmode:o.inputmode, 'data-k':o.k, 'data-ch':o.ch, 'data-id':o.dataId, 'data-field':o.field,
    value:o.value ?? '', 'aria-label':o.label, readonly:o.readonly, placeholder:o.placeholder, min:o.min, max:o.max, step:o.step, required:o.required,
    'aria-describedby':o.describedby, autocomplete:o.autocomplete || 'off', maxlength:o.maxlength, 'data-in':o.inp, title:o.title })}>`;
}
function moneyInp(o){ return inp(Object.assign({ inputmode:'decimal' }, o, { cls:'money ' + (o.cls || ''), value:o.value === '' ? '' : fmtInput(o.value) })); }
function selectEl(o){
  const opts = o.options.map(op => `<option value="${esc(op.v)}"${String(op.v) === String(o.value) ? ' selected' : ''}${op.disabled ? ' disabled' : ''}>${esc(op.l)}</option>`).join('');
  return `<select class="select ${o.cls || ''}"${attrs({ id:o.id, 'data-k':o.k, 'data-ch':o.ch, 'data-id':o.dataId, 'data-field':o.field, 'aria-label':o.label, required:o.required })}>${opts}</select>`;
}
function field(label, control, id, hint, cls = ''){
  return `<div class="field ${cls}"><label for="${id}">${esc(label)}</label>${control}${hint ? `<span class="hint" id="${id}-hint">${hint}</span>` : ''}</div>`;
}
function emptyState(o){
  return `<div class="empty ${o.compact ? 'compact' : ''}">${o.compact ? '' : `<div class="art">${icon(o.icon || 'sparkle','i-lg')}</div>`}
    <div>${o.title ? `<h3>${esc(o.title)}</h3>` : ''}${o.text ? `<p>${esc(o.text)}</p>` : ''}</div>
    ${o.cta ? `<button class="btn btn-primary" type="button"${attrs(o.ctaAttrs)}>${icon('plus')}<span>${esc(o.cta)}</span></button>` : ''}</div>`;
}
function seg(name, items, current, label){
  return `<div class="seg" role="group" aria-label="${esc(label)}">${items.map(i => `<button type="button" data-act="${name}" data-v="${i.v}" aria-pressed="${i.v === current}">${i.icon ? icon(i.icon,'i-sm') : ''}${esc(i.l)}${i.count != null ? ` <span class="count">${i.count}</span>` : ''}</button>`).join('')}</div>`;
}
function viewHead(eyebrow, title, lede, actions = ''){
  return `<header class="view-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1>${lede ? `<p class="lede">${esc(lede)}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</header>`;
}
function progressBar(ratio, label){
  const cls = ratio > 1 ? 'red' : ratio >= 0.9 ? 'amber' : '';
  const w = Math.min(100, Math.max(0, (isFinite(ratio) ? ratio : 1) * 100));
  return `<div class="progress ${cls}" role="progressbar" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(isFinite(ratio) ? ratio * 100 : 100)}"><span style="width:${w}%"></span></div>`;
}
function statusBadge(st){ const m = { idea:'b-neutral', quoted:'b-rose', booked:'b-accent', paid:'b-success' }; return `<span class="badge ${m[st] || 'b-neutral'}">${esc(t('status.' + st))}</span>`; }
function payBadge(p, st){
  const today = C.today;
  if(st === 'paid') return `<span class="badge b-success">${esc(t('pay.paidOn', { date:fmtDayMonth(p.paidDate) }))}</span>`;
  if(st === 'overdue') return `<span class="badge b-danger">${esc(t('pay.overdueBy', { n:daysBetween(p.due, today) }))}</span>`;
  if(st === 'soon'){ const d = daysBetween(today, p.due); return `<span class="badge b-warning">${esc(d === 0 ? t('pay.dueToday') : t('pay.dueIn', { n:d }))}</span>`; }
  return `<span class="badge b-neutral">${esc(t('pay.st.upcoming'))}</span>`;
}
function stars(n){ let s = ''; for(let i = 1; i <= 5; i++) s += icon('star', i <= n ? 'on' : ''); return `<span class="stars" role="img" aria-label="${esc(t('vendor.ratingOf', { n }))}">${s}</span>`; }
function catOptions(e, withNone){ const o = e.categories.map(c => ({ v:c.id, l:c.name })); return withNone ? [{ v:'', l:t('common.none') }].concat(o) : o; }

/* ---------- Chrome (top bar, tabs, bottom nav) ---------- */
function renderChrome(){
  const e = ev();
  document.documentElement.lang = state.prefs.lang;
  document.documentElement.dir = isRTL() ? 'rtl' : 'ltr';
  document.title = (e ? e.name + ' · ' : '') + t('app.name');
  $('.skip-link').textContent = t('a11y.skip');
  $('#brandName').textContent = t('app.name');
  const sel = $('#eventSelect');
  const evs = Object.values(state.events);
  sel.innerHTML = evs.map(x => `<option value="${esc(x.id)}"${x.id === state.activeEventId ? ' selected' : ''}>${esc(x.name)}</option>`).join('') + `<option value="__new">＋ ${esc(t('events.new'))}</option>`;
  if(!evs.length) sel.value = '__new';
  sel.setAttribute('aria-label', t('events.switch'));
  const od = C && e ? C.overdue.length : 0;
  const tabHtml = (mobile) => TABS.map(tb => `<a class="${mobile ? '' : 'tab'}" href="#${tb.id}" ${ui.tab === tb.id ? 'aria-current="page"' : ''}>${icon(tb.icon)}<span>${esc(t('tab.' + tb.id))}</span>${tb.id === 'payments' && od ? `<span class="badge-dot" aria-label="${esc(t('pay.overdueCount', { n:od }))}">${od}</span>` : ''}</a>`).join('');
  $('#tabs').innerHTML = tabHtml(false);
  $('#tabs').setAttribute('aria-label', t('a11y.mainNav'));
  $('#bottomNav').innerHTML = tabHtml(true);
  $('#bottomNav').setAttribute('aria-label', t('a11y.mainNav'));
  const dark = isDark();
  const tb = $('#themeBtn');
  tb.innerHTML = icon(dark ? 'sun' : 'moon');
  tb.setAttribute('aria-label', dark ? t('theme.toLight') : t('theme.toDark'));
  tb.title = tb.getAttribute('aria-label');
  const ub = $('#undoBtn');
  ub.disabled = !undoStack.length;
  ub.setAttribute('aria-label', t('common.undo') + ' (Ctrl+Z)');
  ub.title = ub.getAttribute('aria-label');
  setSaved(ui.storageOk ? ($('#saved').dataset.state === 'saving' ? 'saving' : 'saved') : 'off');
}

function renderNoEvent(){
  return `<section class="view">${emptyState({ icon:'heart', title:t('empty.noEvent.title'), text:t('empty.noEvent.text'), cta:t('events.new'), ctaAttrs:{ 'data-act':'event-new' } })}</section>`;
}

/* ---------- 1) Dashboard ---------- */
function kpi(key, label, value, sub, cls = '', ic = ''){
  return `<div class="kpi ${cls}"><div class="label">${ic ? icon(ic,'i-sm') : ''}${esc(label)}</div>
    <div class="value money" data-ck="kpi-${key}" data-count="${value}">${fmtMoney(value)}</div><div class="sub" title="${esc(sub)}">${esc(sub)}</div></div>`;
}
VIEWS.dashboard = () => {
  const e = ev(), r = C, T = r.totals;
  const days = daysBetween(r.today, e.date);
  const H = { ok:['b-success','health.onTrack'], watch:['b-warning','health.watch'], over:['b-danger','health.over'] }[r.health.level];
  let cd;
  if(days > 0) cd = `<div class="countdown" aria-label="${esc(t('dash.countdownA11y', { d:days, w:Math.floor(days/7) }))}">
      <div><div class="big num">${fmtInt(days)}</div><div class="unit">${esc(t('dash.days'))}</div></div><span class="sep" aria-hidden="true"></span>
      <div><div class="big num">${fmtInt(Math.floor(days/7))}</div><div class="unit">${esc(t('dash.weeks'))}${days % 7 ? ' + ' + days % 7 + ' ' + esc(t('dash.daysShort')) : ''}</div></div></div>`;
  else if(days === 0) cd = `<div class="countdown"><div class="big">${esc(t('dash.today'))}</div></div>`;
  else cd = `<div class="countdown"><div><div class="big num">${fmtInt(-days)}</div><div class="unit">${esc(t('dash.daysAgo'))}</div></div></div>`;
  const booked = e.items.filter(i => i.status === 'booked' || i.status === 'paid').length;
  const due = r.overdue.concat(r.soon).sort((a,b) => (a.st === 'overdue' ? 0 : 1) - (b.st === 'overdue' ? 0 : 1) || a.p.due.localeCompare(b.p.due)).slice(0, 8);
  const insights = computeInsights(e, r);
  return `<section class="view" aria-labelledby="dashTitle">
  <div class="hero">
    <div>
      <div class="eyebrow">${esc(t('type.' + e.type))} · ${esc(fmtDate(e.date, 'full'))}</div>
      <h1 id="dashTitle">${esc(e.name)}</h1>
      <div class="meta">${e.location ? `<span class="row">${icon('pin','i-sm')} ${esc(e.location)}</span>` : ''}<span class="row">${icon('users','i-sm')} ${esc(t('dash.guestsN', { n:fmtInt(r.hc) }))}</span></div>
      <div class="health badge ${H[0]}" role="status"><span class="pip" aria-hidden="true"></span><span>${esc(t(H[1]))}</span><span class="reason">· ${esc(r.health.reason)}</span></div>
    </div>
    ${cd}
  </div>
  <div class="kpis" role="list" aria-label="${esc(t('dash.kpis'))}">
    ${[kpi('budget', t('kpi.budget'), T.budget, t('kpi.budgetSub', { pct:e.contingencyPct + '%' }), 'accent', 'wallet'),
      kpi('allocated', t('kpi.allocated'), T.allocated, t('kpi.ofBudget', { pct:fmtPct(T.budget ? T.allocated / T.budget : 0) }), '', 'layers'),
      kpi('committed', t('kpi.committed'), T.committed, t('kpi.committedSub', { n:booked }), '', 'check'),
      kpi('paid', t('kpi.paid'), T.paid, t('kpi.toPay', { amt:fmtMoney(Math.max(0, T.committed - T.paid)) }), '', 'card'),
      kpi('remaining', t('kpi.remaining'), T.remaining, T.remaining < 0 ? t('kpi.overBudget') : t('kpi.unassigned'), T.remaining < 0 ? 'neg' : '', 'sparkle'),
      kpi('perGuest', t('kpi.perGuest'), T.perGuest, t('kpi.guestsN', { n:fmtInt(r.hc) }), '', 'users')].map(x => x.replace('<div class="kpi', '<div role="listitem" class="kpi')).join('')}
  </div>
  <div class="grid-2 section">
    <div class="card"><div class="card-head"><h3>${esc(t('dash.allocation'))}</h3><a class="btn btn-ghost btn-sm" href="#budget">${esc(t('dash.openBudget'))}${icon('chevron-right','i-sm flip')}</a></div>${chartSlot('chDonut', 240, t('dash.allocationA11y'))}${donutLegend(e, r)}</div>
    <div class="card"><div class="card-head"><h3>${esc(t('dash.plannedActual'))}</h3></div>${chartSlot('chBars', Math.max(220, e.categories.length * 28 + 50), t('dash.plannedActualA11y'))}</div>
  </div>
  <div class="grid-2 section">
    <div class="card"><div class="card-head"><h3>${esc(t('dash.dueSoon'))}</h3><a class="btn btn-ghost btn-sm" href="#payments">${esc(t('dash.allPayments'))}${icon('chevron-right','i-sm flip')}</a></div>
      ${due.length ? `<ul class="list">${due.map(({ p, st }) => `<li data-key="due-${p.id}"><div class="date-block" aria-hidden="true"><span class="d">${parseISO(p.due).getDate()}</span><span class="m">${esc(fmtMonthShort(p.due.slice(0,7)))}</span></div>
        <div class="grow"><div class="title">${esc(itemLabel(e, p.itemId))}</div><div class="row-wrap small muted">${payBadge(p, st)}<span>${esc(t('pay.type.' + p.type))}</span></div></div>
        <div class="stack-sm" style="align-items:flex-end"><b class="money ${st === 'overdue' ? 'neg' : ''}">${fmtMoney(signedPay(p))}</b><button class="btn btn-sm" data-act="pay-paid" data-id="${p.id}" aria-label="${esc(t('pay.markPaid') + ' — ' + itemLabel(e, p.itemId))}">${icon('check','i-sm')}<span class="hide-sm">${esc(t('pay.markPaid'))}</span></button></div></li>`).join('')}</ul>`
        : emptyState({ compact:true, text:t('dash.nothingDue'), cta:t('pay.add'), ctaAttrs:{ 'data-act':'pay-add' } })}
    </div>
    <div class="card"><div class="card-head"><h3>${esc(t('dash.insights'))}</h3></div>
      <div>${insights.map(i => `<div class="insight tone-${i.tone}"><span class="ic">${icon(i.icon,'i-sm')}</span><p>${esc(i.text)}</p></div>`).join('')}</div>
    </div>
  </div>
  <div class="card section"><div class="card-head"><h3>${esc(t('dash.cashflow'))}</h3><span class="small muted">${esc(t('dash.cashflowSub'))}</span></div>${chartSlot('chFlow', 240, t('dash.cashflowA11y'))}</div>
</section>`;
};
AFTER.dashboard = () => drawDashboardCharts();
function donutLegend(e, r){
  const T = r.totals.budget || 1;
  return `<ul class="legend-list">${e.categories.map((c,i) => `<li><span class="sw" style="background:${catColor(i)}"></span><span class="nm">${esc(c.name)}</span><span class="small muted num">${fmtPct(r.cats.get(c.id).alloc / T)}</span></li>`).join('')}</ul>`;
}

/* ---------- 2) Budget ---------- */
VIEWS.budget = () => {
  const head = viewHead(t('tab.budget'), ui.budgetView === 'scenarios' ? t('scen.title') : t('budget.title'), ui.budgetView === 'scenarios' ? t('scen.lede') : t('budget.lede'),
    seg('budget-view', [{ v:'table', l:t('budget.viewTable'), icon:'wallet' }, { v:'scenarios', l:t('budget.viewScenarios'), icon:'layers' }], ui.budgetView, t('budget.viewLabel')));
  if(ui.budgetView === 'scenarios') return `<section class="view">${head}${renderScenarios()}</section>`;
  const e = ev(), r = C, T = r.totals;
  const allocPctSum = T.budget ? sum(e.categories, c => r.cats.get(c.id).alloc) / T.budget : 0;
  const q = ui.search.trim().toLowerCase();
  const filtering = !!(q || ui.fStatus || ui.fPriority);
  const match = it => (!ui.fStatus || it.status === ui.fStatus) && (!ui.fPriority || it.priority === ui.fPriority) &&
    (!q || (it.name + ' ' + it.notes + ' ' + (byId(e.vendors, it.vendorId)?.name || '')).toLowerCase().includes(q));
  const groups = e.categories.map((c,i) => {
    const its = e.items.filter(it => it.catId === c.id && match(it));
    if(filtering && !its.length) return '';
    return catGroup(e, c, i, its, filtering);
  }).join('');
  return `<section class="view">${head}
  <div class="card total-card">
    <div class="field"><label for="totalBudget">${esc(t('budget.total'))}</label>
      <div class="input-affix"><span class="affix">${esc(curSymbol(e))}</span>${moneyInp({ id:'totalBudget', k:'total', ch:'total', value:e.totalBudget, cls:'total-input', label:t('budget.total') })}</div></div>
    <div class="stat"><div class="label">${esc(t('budget.allocatedPct'))}</div><div class="value num ${Math.abs(allocPctSum - 1) < 0.0001 ? 'pos' : 'warn'}">${fmtPct(allocPctSum, 1)}</div></div>
    <div class="stat"><div class="label">${esc(t('budget.forecast'))}</div><div class="value money ${T.forecast > T.budget ? 'neg' : ''}">${fmtMoney(T.forecast)}</div></div>
    <div class="stat"><div class="label">${esc(t('budget.headcount'))}</div><div class="value num">${fmtInt(r.hc)} <a class="small" href="#guests">${esc(t('budget.edit'))}</a></div></div>
  </div>
  ${r.lockedOver ? `<div class="alerts"><div class="alert danger" role="alert">${icon('alert')}<div>${esc(t('budget.lockedOver'))}</div></div></div>` : ''}
  <div class="toolbar" role="search">
    <div class="input-search">${icon('search','i-sm')}${inp({ type:'search', k:'search', inp:'search', value:ui.search, label:t('budget.search'), placeholder:t('budget.search') })}</div>
    ${selectEl({ k:'fStatus', ch:'f-status', value:ui.fStatus, label:t('budget.filterStatus'), options:[{ v:'', l:t('budget.allStatuses') }].concat(ITEM_STATUSES.map(s => ({ v:s, l:t('status.' + s) }))) })}
    ${selectEl({ k:'fPrio', ch:'f-priority', value:ui.fPriority, label:t('budget.filterPriority'), options:[{ v:'', l:t('budget.allPriorities') }].concat(PRIORITIES.map(s => ({ v:s, l:t('prio.' + s) }))) })}
    <button class="btn btn-ghost btn-sm" data-act="collapse-all" data-v="${e.categories.every(c => c.collapsed) ? '0' : '1'}">${icon('chevron-down','i-sm')}${esc(e.categories.every(c => c.collapsed) ? t('budget.expandAll') : t('budget.collapseAll'))}</button>
    <button class="btn btn-primary btn-sm" data-act="cat-add">${icon('plus','i-sm')}${esc(t('budget.addCategory'))}</button>
  </div>
  <div id="catList">${groups || (filtering ? emptyState({ icon:'search', title:t('budget.noMatch'), text:t('budget.noMatchText'), cta:t('budget.clearFilters'), ctaAttrs:{ 'data-act':'clear-filters' } })
      : emptyState({ icon:'wallet', title:t('budget.noCats'), text:t('budget.noCatsText'), cta:t('budget.addCategory'), ctaAttrs:{ 'data-act':'cat-add' } }))}</div>
</section>`;
};
function curSymbol(e){
  if(e.currency === 'CUSTOM') return e.customSymbol || '¤';
  try { return nf(numLocale(e), { style:'currency', currency:e.currency, currencyDisplay:'narrowSymbol' }).formatToParts(0).find(p => p.type === 'currency').value; } catch(_){ return e.currency; }
}
function catGroup(e, c, i, its, filtering){
  const cc = C.cats.get(c.id), T = C.totals;
  const pct = T.budget ? cc.alloc / T.budget * 100 : 0;
  const ratio = cc.ratio;
  const color = catColor(i);
  const rows = its.map(it => itemRow(e, it)).join('');
  const isCont = c.key === 'contingency';
  return `<section class="cat ${c.collapsed && !filtering ? 'collapsed' : ''}" data-key="cat-${c.id}" data-drop="cat" data-id="${c.id}" aria-labelledby="catname-${c.id}">
    <div class="cat-head">
      <button class="handle" type="button" data-drag="cat" data-id="${c.id}" data-k="drag-cat-${c.id}" aria-label="${esc(t('budget.reorderCat', { name:c.name }))}" title="${esc(t('budget.dragHint'))}">${icon('grip','i-sm')}</button>
      <button class="btn-icon sm collapse-btn" type="button" data-act="cat-toggle" data-id="${c.id}" aria-expanded="${!(c.collapsed && !filtering)}" aria-controls="items-${c.id}" aria-label="${esc(t(c.collapsed ? 'budget.expand' : 'budget.collapse', { name:c.name }))}">${icon('chevron-down')}</button>
      <div class="cat-name"><span class="cat-swatch" style="background:${color}" aria-hidden="true"></span>${inp({ id:'catname-' + c.id, k:'catname-' + c.id, ch:'cat-rename', dataId:c.id, value:c.name, label:t('budget.catName'), maxlength:60 })}</div>
      <div class="cat-meter">${progressBar(ratio, t('budget.spentOf', { name:c.name }))}
        <div class="meta"><span class="money">${esc(t('budget.forecastOfAlloc', { f:fmtMoney(cc.forecast), a:fmtMoney(cc.alloc) }))}</span>
        <span class="${ratio > 1 ? 'neg strong' : ratio >= 0.9 ? 'warn strong' : ''}">${isFinite(ratio) ? fmtPct(ratio) : '—'}${isCont ? ' · ' + esc(t('budget.contingencyNote')) : ''}</span></div></div>
      <div class="cat-alloc">
        ${moneyInp({ k:'catamt-' + c.id, ch:'cat-amount', dataId:c.id, value:cc.alloc, label:t('budget.allocFor', { name:c.name }) })}
        <div class="pct-wrap">${inp({ k:'catpct-' + c.id, ch:'cat-pct', dataId:c.id, value:nf(numLocale(), { maximumFractionDigits:1 }).format(pct), inputmode:'decimal', label:t('budget.pctFor', { name:c.name }) })}</div>
        <button class="btn-icon sm" type="button" data-act="cat-lock" data-id="${c.id}" aria-pressed="${!!c.locked}" aria-label="${esc(t(c.locked ? 'budget.unlock' : 'budget.lock', { name:c.name }))}" title="${esc(t(c.locked ? 'budget.lockedTip' : 'budget.lockTip'))}">${icon(c.locked ? 'lock' : 'unlock')}</button>
      </div>
      <button class="btn-icon sm cat-del" type="button" data-act="cat-delete" data-id="${c.id}" aria-label="${esc(t('budget.deleteCat', { name:c.name }))}">${icon('trash')}</button>
    </div>
    <div class="items" id="items-${c.id}" role="table" aria-label="${esc(t('budget.itemsIn', { name:c.name }))}" data-drop-cat="${c.id}">
      ${its.length ? `<div class="ihead" role="row"><span role="columnheader"><span class="sr-only">${esc(t('budget.order'))}</span></span><span role="columnheader">${esc(t('budget.col.name'))}</span>
        ${['estimate','quote','actual','paid','balance','variance'].map(f => `<span role="columnheader" class="r">${esc(t('budget.col.' + f))}</span>`).join('')}
        <span role="columnheader">${esc(t('budget.col.status'))}</span><span role="columnheader">${esc(t('budget.col.priority'))}</span><span role="columnheader"><span class="sr-only">${esc(t('common.actions'))}</span></span></div>${rows}` : ''}
      <div class="add-item">${its.length ? '' : `<span class="muted small" style="align-self:center;margin-inline-end:12px">${esc(t('budget.noItems', { name:c.name }))}</span>`}<button class="btn btn-ghost btn-sm" type="button" data-act="item-add" data-cat="${c.id}">${icon('plus','i-sm')}${esc(t('budget.addItem'))}</button></div>
    </div>
  </section>`;
}
function itemRow(e, it){
  const x = C.items.get(it.id);
  const vendor = it.vendorId ? byId(e.vendors, it.vendorId) : null;
  const ph = it.perHead;
  const per = ph ? ' · ' + t('budget.perGuest') : '';
  const varCls = x.variance > 0 ? 'neg' : x.variance < 0 ? 'pos' : 'muted';
  const cell = (f, html) => `<div class="cell" role="cell"><span class="cell-label">${esc(t('budget.col.' + f))}${['estimate','quote','actual'].includes(f) ? esc(per) : ''}</span>${html}</div>`;
  const mi = f => moneyInp({ k:`it-${it.id}-${f}`, ch:'item-money', dataId:it.id, field:f, value:(f !== 'estimate' && !it[f]) ? '' : it[f], placeholder:'—',
    label:t('budget.col.' + f) + per + ' — ' + it.name, readonly:f === 'estimate' && it.estimateLocked, title:f === 'estimate' && it.estimateLocked ? t('budget.estimateLocked') : undefined });

/* ---------- 7) Scenarios (inside Budget) ---------- */
function renderScenarios(){
  const e = ev();
  const rows = e.scenarios.map(s => { const se = scenarioEvent(e, s); return { s, se, r:s.id === e.activeScenarioId ? C : computeAll(se) }; });
  const act = rows.find(x => x.s.id === e.activeScenarioId);
  const delta = (v, base, invert) => { if(v === base) return ''; const d = v - base; const bad = invert ? d < 0 : d > 0; return `<span class="delta ${bad ? 'neg' : 'pos'}">${fmtMoney(d, { sign:true })}</span>`; };
  const catIds = []; rows.forEach(x => x.se.categories.forEach(c => { if(!catIds.some(k => k.id === c.id)) catIds.push({ id:c.id, name:c.name }); }));
  const line = (label, get, invert, fmt = fmtMoney) => `<tr><th scope="row">${esc(label)}</th>${rows.map(x => { const v = get(x); return `<td class="money">${v == null ? '—' : fmt(v)}${x === act || v == null ? '' : (fmt === fmtMoney ? delta(v, get(act) ?? 0, invert) : '')}</td>`; }).join('')}</tr>`;
  return `<div class="grid-auto">${rows.map(({ s, r }) => `<article class="card stack-sm" data-key="scen-${s.id}">
      <div class="row"><input class="input" style="font-family:var(--font-serif);font-size:22px;font-weight:600;border-color:transparent;background:transparent;padding-inline:0" data-ch="scen-name" data-id="${s.id}" data-k="scen-${s.id}" value="${esc(s.name)}" aria-label="${esc(t('scen.name'))}" maxlength="40">
        ${s.id === e.activeScenarioId ? `<span class="badge b-accent">${esc(t('scen.active'))}</span>` : ''}</div>
      <dl class="kv"><dt>${esc(t('kpi.budget'))}</dt><dd class="money">${fmtMoney(r.totals.budget)}</dd><dt>${esc(t('budget.forecast'))}</dt><dd class="money">${fmtMoney(r.totals.forecast)}</dd>
        <dt>${esc(t('kpi.remaining'))}</dt><dd class="money ${r.totals.remaining < 0 ? 'neg' : 'pos'}">${fmtMoney(r.totals.remaining)}</dd><dt>${esc(t('budget.headcount'))}</dt><dd class="num">${fmtInt(r.hc)}</dd></dl>
      <div class="row-wrap" style="margin-top:8px">${s.id === e.activeScenarioId ? `<span class="small muted">${esc(t('scen.editingNote'))}</span>` :
        `<button class="btn btn-primary btn-sm" data-act="scen-activate" data-id="${s.id}">${icon('check','i-sm')}${esc(t('scen.setActive'))}</button><button class="btn btn-ghost btn-sm btn-danger" data-act="scen-delete" data-id="${s.id}">${icon('trash','i-sm')}${esc(t('common.delete'))}</button>`}</div>
    </article>`).join('')}
    <form class="card stack-sm" data-form="scen-dup" novalidate><h3>${esc(t('scen.duplicate'))}</h3><p class="small muted">${esc(t('scen.duplicateText'))}</p>
      ${field(t('scen.name'), inp({ id:'scenName', k:'scenName', placeholder:t('scen.placeholder'), maxlength:40, required:true }), 'scenName')}
      <div><button class="btn btn-primary" type="submit">${icon('copy','i-sm')}${esc(t('scen.duplicateBtn'))}</button></div></form>
  </div>
  ${rows.length > 1 ? `<div class="card section"><div class="card-head"><h3>${esc(t('scen.compare'))}</h3><span class="small muted">${esc(t('scen.deltaNote', { name:act.s.name }))}</span></div>
    <div class="table-wrap"><table class="t scen-table"><thead><tr><th scope="col">${esc(t('scen.metric'))}</th>${rows.map(x => `<th scope="col" class="money">${esc(x.s.name)}${x === act ? ' ★' : ''}</th>`).join('')}</tr></thead><tbody>
    ${line(t('kpi.budget'), x => x.r.totals.budget, true)}
    ${line(t('budget.headcount'), x => x.r.hc, false, fmtInt)}
    ${line(t('budget.forecast'), x => x.r.totals.forecast)}
    ${line(t('kpi.committed'), x => x.r.totals.committed)}
    ${line(t('kpi.remaining'), x => x.r.totals.remaining, true)}
    ${line(t('kpi.perGuest'), x => x.r.totals.perGuest)}
    ${catIds.map(c => line(c.name, x => x.r.cats.has(c.id) ? x.r.cats.get(c.id).forecast : null)).join('')}
    </tbody></table></div></div>` : ''}`;
}

  const alerts = [];
  if(r.overdue.length) alerts.push(`<div class="alert danger" role="alert">${icon('alert')}<div>${t('pay.alertOverdue', { n:`<b>${r.overdue.length}</b>`, amt:`<b>${esc(fmtMoney(sum(r.overdue, x => signedPay(x.p))))}</b>` })}</div></div>`);
  if(r.soon.length) alerts.push(`<div class="alert warning">${icon('calendar')}<div>${t('pay.alertSoon', { n:`<b>${r.soon.length}</b>`, amt:`<b>${esc(fmtMoney(sum(r.soon, x => signedPay(x.p))))}</b>` })}</div></div>`);
  r.overpaid.forEach(it => { const x = r.items.get(it.id); alerts.push(`<div class="alert danger" role="alert">${icon('alert')}<div>${t('pay.alertOverpaid', { name:`<b>${esc(it.name)}</b>`, paid:esc(fmtMoney(x.paid)), c:esc(fmtMoney(x.contracted)) })}</div></div>`); });
  let body;
  if(ui.payView === 'tips') body = renderTips();
  else {
    const all = e.payments.map(p => ({ p, st:payStatus(p, r.today) }));
    const counts = { upcoming:all.filter(x => x.st === 'soon' || x.st === 'upcoming').length, overdue:all.filter(x => x.st === 'overdue').length, paid:all.filter(x => x.st === 'paid').length, all:all.length };
    const f = ui.payFilter;
    let list = all.filter(x => f === 'all' || (f === 'upcoming' ? (x.st === 'soon' || x.st === 'upcoming') : x.st === f));
    list.sort((a,b) => f === 'paid' ? (b.p.paidDate || '').localeCompare(a.p.paidDate || '') : (a.p.due || '').localeCompare(b.p.due || ''));
    const filt = seg('pay-filter', ['upcoming','overdue','paid','all'].map(v => ({ v, l:t('pay.f.' + v), count:counts[v] })), f, t('pay.filterLabel'));
    const tot = sum(list, x => signedPay(x.p)), paidTot = sum(list.filter(x => x.st === 'paid'), x => signedPay(x.p));
    const totals = `<div class="totals-bar" role="status"><span>${esc(t('pay.nPayments', { n:list.length }))}</span><span>${esc(t('pay.total'))}: <b class="money">${fmtMoney(tot)}</b></span><span>${esc(t('pay.paidSum'))}: <b class="money pos">${fmtMoney(paidTot)}</b></span><span>${esc(t('pay.outstanding'))}: <b class="money">${fmtMoney(tot - paidTot)}</b></span></div>`;
    const inner = ui.payView === 'calendar' ? renderCalendar(e, list) : renderTimeline(e, list);
    body = `<div class="toolbar">${filt}</div>${totals}${inner}`;
  }
  return `<section class="view">${head}<div class="toolbar">${views}</div>${alerts.length ? `<div class="alerts">${alerts.join('')}</div>` : ''}${body}</section>`;
};
function payRow(e, p, st){

function renderTimeline(e, list){
  if(!list.length) return e.payments.length ? emptyState({ icon:'check', title:t('pay.emptyFilter'), text:t('pay.emptyFilterText') })
    : emptyState({ icon:'card', title:t('pay.empty'), text:t('pay.emptyText'), cta:t('pay.add'), ctaAttrs:{ 'data-act':'pay-add' } });
  const groups = new Map();
  list.forEach(x => { const m = (ui.payFilter === 'paid' ? x.p.paidDate : x.p.due).slice(0,7); if(!groups.has(m)) groups.set(m, []); groups.get(m).push(x); });
  return [...groups].map(([m, xs]) => `<div class="month-group" data-key="m-${m}"><h2 class="month-title">${esc(fmtMonth(m))} <span class="small muted money">${fmtMoney(sum(xs, x => signedPay(x.p)))}</span></h2>${xs.map(x => payRow(e, x.p, x.st)).join('')}</div>`).join('');
}
function renderCalendar(e, list){
  const ym = ui.calMonth || C.today.slice(0,7);
  const first = parseISO(ym + '-01');
  const startOffset = (first.getDay() + 6) % 7; // Monday first
  const start = addDays(ym + '-01', -startOffset);
  const lastDay = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const cells = Math.ceil((startOffset + lastDay) / 7) * 7;
  const byDay = new Map(); list.forEach(x => { const k = x.p.due; if(!byDay.has(k)) byDay.set(k, []); byDay.get(k).push(x); });
  const dows = []; for(let i = 0; i < 7; i++) dows.push(dtf({ weekday:'short' }).format(parseISO(addDays('2024-01-01', i))));
  let html = '';
  for(let i = 0; i < cells; i++){
    const d = addDays(start, i);
    const xs = byDay.get(d) || [];
    const lbl = fmtDate(d, 'full') + (xs.length ? ' — ' + t('pay.nPayments', { n:xs.length }) : '') + (d === e.date ? ' — ' + t('pay.eventDay') : '');
    html += `<div class="day ${d.slice(0,7) !== ym ? 'out' : ''} ${d === C.today ? 'today' : ''} ${d === e.date ? 'event' : ''}" role="gridcell" aria-label="${esc(lbl)}"><span class="n" aria-hidden="true">${parseISO(d).getDate()}</span>
      <div class="evs">${xs.map(x => `<button class="ev ${x.st}" data-act="pay-edit" data-id="${x.p.id}" title="${esc(itemLabel(e, x.p.itemId) + ' · ' + fmtMoney(signedPay(x.p)))}" aria-label="${esc(itemLabel(e, x.p.itemId) + ' · ' + fmtMoney(signedPay(x.p)) + ' · ' + t('pay.st.' + x.st))}">${esc(fmtCompact(signedPay(x.p)))} ${esc(itemLabel(e, x.p.itemId))}</button>`).join('')}</div></div>`;
  }
  const monthList = list.filter(x => x.p.due.slice(0,7) === ym);
  return `<div class="card card-tight"><div class="card-head"><h3 aria-live="polite">${esc(fmtMonth(ym))}</h3>
      <button class="btn-icon sm" data-act="cal-prev" aria-label="${esc(t('pay.prevMonth'))}">${icon('chevron-left','flip')}</button>
      <button class="btn btn-sm" data-act="cal-today">${esc(t('pay.thisMonth'))}</button>
      <button class="btn-icon sm" data-act="cal-next" aria-label="${esc(t('pay.nextMonth'))}">${icon('chevron-right','flip')}</button></div>
    <div class="cal" role="grid" aria-label="${esc(fmtMonth(ym))}"><div role="row" style="display:contents">${dows.map(d => `<div class="dow" role="columnheader">${esc(d)}</div>`).join('')}</div><div role="row" style="display:contents">${html}</div></div>
    <div class="legend"><span><i style="background:var(--danger)"></i>${esc(t('pay.st.overdue'))}</span><span><i style="background:var(--warning)"></i>${esc(t('pay.st.soon'))}</span><span><i style="background:var(--accent)"></i>${esc(t('pay.st.upcoming'))}</span><span><i style="background:var(--success)"></i>${esc(t('pay.st.paid'))}</span><span><i style="background:transparent;box-shadow:inset 0 0 0 2px var(--rose)"></i>${esc(t('pay.eventDay'))}</span></div></div>
  <div class="section">${monthList.length ? monthList.map(x => payRow(e, x.p, x.st)).join('') : `<p class="muted">${esc(t('pay.noneThisMonth'))}</p>`}</div>`;
}
function tipRows(e){
  return e.vendors.map(v => {
    const its = e.items.filter(it => it.vendorId === v.id);
    const contracted = sum(its, it => C.items.get(it.id).contracted);
    const cat = byId(e.categories, v.catId);
    const pct = TIP_DEFAULTS[cat?.key] ?? 0;
    const suggested = Math.round(contracted * pct / 100 / 100) * 100;
    const planned = v.tip == null || v.tip === '' ? suggested : v.tip;
    const cashDue = sum(e.payments.filter(p => its.some(it => it.id === p.itemId) && !p.paidDate && p.method === 'cash' && p.due === e.date), p => signedPay(p));
    return { v, cat, contracted, pct, suggested, planned, cashDue, envelope:planned + cashDue };
  });
}

  <div class="card section"><div class="card-head"><h3>${esc(t('tips.envelopes'))}</h3><button class="btn btn-sm" data-act="print-envelopes" ${env.length ? '' : 'disabled'}>${icon('print','i-sm')}${esc(t('tips.print'))}</button></div>

    ${env.length ? `<ul class="list">${env.map(x => `<li><span class="avatar" aria-hidden="true">${esc((x.v.name || '?').trim().charAt(0).toUpperCase())}</span><div class="grow"><div class="title">${esc(x.v.name)}</div><div class="small muted">${esc(t('tips.envBreakdown', { tip:fmtMoney(x.planned), due:fmtMoney(x.cashDue) }))}</div></div><b class="money">${fmtMoney(x.envelope)}</b></li>`).join('')}
      <li><div class="grow title">${esc(t('tips.cashNeeded'))}</div><b class="money" style="font-size:18px">${fmtMoney(sum(env, x => x.envelope))}</b></li></ul>` : `<p class="muted">${esc(t('tips.noEnvelopes'))}</p>`}
  </div>`;

function linkify(kind, val){
  if(!val) return '';
  const v = String(val).trim();
  if(kind === 'phone') return `<a href="tel:${esc(v.replace(/[^\d+]/g,''))}">${icon('phone','i-sm')}<span>${esc(v)}</span></a>`;
  if(kind === 'email') return `<a href="mailto:${esc(v)}">${icon('mail','i-sm')}<span>${esc(v)}</span></a>`;
  if(kind === 'website'){ const u = /^https?:\/\//i.test(v) ? v : 'https://' + v; return `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${icon('globe','i-sm')}<span>${esc(v.replace(/^https?:\/\//i,''))}</span></a>`; }
  if(kind === 'instagram'){ const h = v.replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//i,'').replace(/\/$/,''); return `<a href="https://instagram.com/${esc(encodeURIComponent(h))}" target="_blank" rel="noopener noreferrer">${icon('instagram','i-sm')}<span>@${esc(h)}</span></a>`; }
  return '';
}
function renderVendorCards(e){

function renderQuotes(e){

  if(!catsWith.some(c => c.id === ui.quoteCat)) ui.quoteCat = catsWith[0]?.id || null;
  const qs = e.quotes.filter(q => q.catId === ui.quoteCat);

        ${q.pros ? `<div><dt>${esc(t('quote.pros'))}</dt><dd class="pos">${esc(q.pros)}</dd></div>` : ''}${q.cons ? `<div><dt>${esc(t('quote.cons'))}</dt><dd class="neg">${esc(q.cons)}</dd></div>` : ''}</dl>

/* ---------- 5) Guests ---------- */
function forecastAt(e, n){ const tmp = Object.assign({}, e, { guests:Object.assign({}, e.guests, { expected:n, useList:false }) }); return computeAll(tmp).totals.forecast; }
VIEWS.guests = () => {
  const e = ev(), r = C;
  const base = forecastAt(e, e.guests.expected);
  const sc = ['min','expected','max'].map(k => {
    const n = e.guests[k] || 0, f = forecastAt(e, n);
    return `<div class="card stack-sm ${k === 'expected' ? 'winner-card' : ''}" data-key="gs-${k}">
      <div class="row"><h3 style="margin:0;flex:1">${esc(t('guests.' + k))}</h3>${k === 'expected' ? `<span class="badge b-accent">${esc(t('guests.drivesBudget'))}</span>` : ''}</div>
      ${field(t('guests.count'), inp({ id:'g-' + k, k:'g-' + k, ch:'guests-count', field:k, value:n, inputmode:'numeric', type:'number', min:0, step:1 }), 'g-' + k)}
      <dl class="kv"><dt>${esc(t('guests.totalCost'))}</dt><dd class="money" data-ck="gs-${k}" data-count="${f}">${fmtMoney(f)}</dd>
        <dt>${esc(t('guests.vsExpected'))}</dt><dd class="money ${f - base > 0 ? 'neg' : f - base < 0 ? 'pos' : ''}">${f === base ? '—' : fmtMoney(f - base, { sign:true })}</dd>
        <dt>${esc(t('kpi.perGuest'))}</dt><dd class="money">${n ? fmtMoney(Math.round(f / n)) : '—'}</dd>
        <dt>${esc(t('guests.vsBudget'))}</dt><dd class="money ${f > e.totalBudget ? 'neg' : 'pos'}">${fmtMoney(e.totalBudget - f, { sign:true })}</dd></dl></div>`;
  }).join('');
  const L = e.guestList;
  const yes = L.filter(g => g.rsvp === 'yes'), no = L.filter(g => g.rsvp === 'no'), pend = L.filter(g => g.rsvp === 'pending');
  const heads = arr => sum(arr, g => (Number(g.adults) || 0) + (Number(g.children) || 0));
  const sideOpts = [{ v:'a', l:e.sideNames[0] }, { v:'b', l:e.sideNames[1] }, { v:'both', l:t('guests.both') }];
  const perCat = e.categories.map((c,i) => ({ c, i, f:r.cats.get(c.id).forecast })).filter(x => x.f > 0);
  const maxF = Math.max(1, ...perCat.map(x => x.f));
  return `<section class="view">${viewHead(t('tab.guests'), t('guests.title'), t('guests.lede'))}
  <div class="grid-3">${sc}</div>
  <div class="card section"><div class="card-head"><h3>${esc(t('guests.source'))}</h3></div>
    <label class="switch"><input type="checkbox" role="switch" data-ch="guests-uselist" data-k="uselist" ${e.guests.useList ? 'checked' : ''}><span>${esc(t('guests.useList'))}</span></label>
    <p class="small muted" style="margin-top:6px">${esc(e.guests.useList && L.length ? t('guests.fromList', { n:fmtInt(r.hc) }) : t('guests.fromExpected', { n:fmtInt(r.hc) }))}</p></div>
  <div class="card section"><div class="card-head"><h3>${esc(t('guests.list'))}</h3>
      <div class="row-wrap small"><span class="badge b-success">${esc(t('guests.yesN', { n:heads(yes) }))}</span><span class="badge b-neutral">${esc(t('guests.pendingN', { n:heads(pend) }))}</span><span class="badge b-danger">${esc(t('guests.noN', { n:heads(no) }))}</span></div></div>
    <div class="row-wrap" style="margin-bottom:12px">${['a','b'].map((s,i) => `<div class="field" style="flex:1 1 160px">${'<label for="side-' + i + '">' + esc(t('guests.sideName', { n:i + 1 })) + '</label>'}${inp({ id:'side-' + i, k:'side-' + i, ch:'side-name', field:String(i), value:e.sideNames[i], maxlength:30 })}</div>`).join('')}</div>
    <form class="row-wrap" data-form="guest-add" novalidate style="margin-bottom:12px"><div style="flex:1 1 220px">${inp({ id:'newGuest', k:'newGuest', placeholder:t('guests.namePh'), label:t('guests.name'), maxlength:80 })}</div><button class="btn btn-primary" type="submit">${icon('plus','i-sm')}${esc(t('guests.add'))}</button></form>
    ${L.length ? `<div class="table-wrap"><table class="t stack-sm-table"><thead><tr><th>${esc(t('guests.name'))}</th><th>${esc(t('guests.side'))}</th><th>${esc(t('guests.adults'))}</th><th>${esc(t('guests.children'))}</th><th>${esc(t('guests.rsvp'))}</th><th><span class="sr-only">${esc(t('common.actions'))}</span></th></tr></thead><tbody>
      ${L.map(g => `<tr data-key="g-${g.id}"><td class="full" data-label="${esc(t('guests.name'))}">${inp({ k:`g-${g.id}-name`, ch:'guest-field', dataId:g.id, field:'name', value:g.name, label:t('guests.name'), maxlength:80 })}</td>
        <td data-label="${esc(t('guests.side'))}">${selectEl({ k:`g-${g.id}-side`, ch:'guest-field', dataId:g.id, field:'side', value:g.side, label:t('guests.side') + ' — ' + g.name, options:sideOpts })}</td>
        <td data-label="${esc(t('guests.adults'))}">${inp({ k:`g-${g.id}-adults`, ch:'guest-field', dataId:g.id, field:'adults', value:g.adults, type:'number', min:0, step:1, inputmode:'numeric', label:t('guests.adults') + ' — ' + g.name })}</td>
        <td data-label="${esc(t('guests.children'))}">${inp({ k:`g-${g.id}-children`, ch:'guest-field', dataId:g.id, field:'children', value:g.children, type:'number', min:0, step:1, inputmode:'numeric', label:t('guests.children') + ' — ' + g.name })}</td>
        <td data-label="${esc(t('guests.rsvp'))}">${selectEl({ k:`g-${g.id}-rsvp`, ch:'guest-field', dataId:g.id, field:'rsvp', value:g.rsvp, label:t('guests.rsvp') + ' — ' + g.name, options:RSVP.map(s => ({ v:s, l:t('rsvp.' + s) })) })}</td>
        <td><button class="btn-icon sm" data-act="guest-delete" data-id="${g.id}" aria-label="${esc(t('guests.remove', { name:g.name }))}">${icon('trash')}</button></td></tr>`).join('')}
      </tbody><tfoot><tr><td>${esc(t('pay.total'))}</td><td></td><td class="num">${fmtInt(sum(L, g => +g.adults || 0))}</td><td class="num">${fmtInt(sum(L, g => +g.children || 0))}</td><td colspan="2">${esc(t('guests.headsN', { n:fmtInt(heads(L)) }))}</td></tr></tfoot></table></div>`
      : `<p class="muted small">${esc(t('guests.listEmpty'))}</p>`}
  </div>

  </div>
</section>`;
};

/* ---------- 6) Funding ---------- */
VIEWS.funding = () => {
  const e = ev(), T = C.totals;
  const pledged = sum(e.contributors, c => c.pledged), received = sum(e.contributors, c => c.received);
  const gapSecured = received - T.committed, gapPledged = pledged - T.forecast;
  const scale = Math.max(T.forecast, pledged, received, 1);
  const outstanding = Math.max(0, pledged - received);
  const shortfall = Math.max(0, T.forecast - Math.max(pledged, received));
  const gapCard = (title, v, sub) => `<div class="card gap-card"><div class="small strong muted">${esc(title)}</div><div class="value money ${v < 0 ? 'neg' : 'pos'}">${fmtMoney(Math.abs(v))}</div><span class="badge ${v < 0 ? 'b-danger' : 'b-success'}" style="align-self:flex-start">${esc(v < 0 ? t('fund.shortfall') : t('fund.surplus'))}</span><p class="small muted">${esc(sub)}</p></div>`;
  return `<section class="view">${viewHead(t('tab.funding'), t('fund.title'), t('fund.lede'), `<button class="btn btn-primary" data-act="contrib-add">${icon('plus','i-sm')}${esc(t('fund.add'))}</button>`)}
  <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))">
    ${kpi('pledged', t('fund.pledged'), pledged, t('fund.nContrib', { n:e.contributors.length }), 'accent', 'heart')}
    ${kpi('received', t('fund.received'), received, pledged ? t('fund.ofPledged', { pct:fmtPct(received / pledged) }) : '—', '', 'coins')}
    ${kpi('fcommitted', t('kpi.committed'), T.committed, t('fund.signed'), '', 'check')}
    ${kpi('fforecast', t('budget.forecast'), T.forecast, t('fund.allItems'), '', 'layers')}
  </div>
  <div class="grid-2 section">${gapCard(t('fund.gapSecured'), gapSecured, t('fund.gapSecuredSub'))}${gapCard(t('fund.gapPledged'), gapPledged, t('fund.gapPledgedSub'))}</div>
  <div class="card section"><div class="card-head"><h3>${esc(t('fund.coverage'))}</h3></div>
    <div class="stack-bar" role="img" aria-label="${esc(t('fund.coverageA11y', { r:fmtMoney(received), p:fmtMoney(pledged), f:fmtMoney(T.forecast) }))}">
      <span style="width:${received / scale * 100}%;background:var(--accent)"></span><span style="width:${outstanding / scale * 100}%;background:var(--rose)"></span><span style="width:${shortfall / scale * 100}%;background:repeating-linear-gradient(45deg,var(--danger) 0 4px,transparent 4px 8px)"></span></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>${esc(t('fund.received'))} ${fmtMoney(received)}</span><span><i style="background:var(--rose)"></i>${esc(t('fund.outstanding'))} ${fmtMoney(outstanding)}</span><span><i style="background:var(--danger)"></i>${esc(t('fund.unfunded'))} ${fmtMoney(shortfall)}</span></div></div>
  <div class="card section"><div class="card-head"><h3>${esc(t('fund.contributors'))}</h3></div>
    ${e.contributors.length ? `<div class="table-wrap"><table class="t stack-sm-table"><thead><tr><th>${esc(t('fund.name'))}</th><th>${esc(t('fund.type'))}</th><th class="money">${esc(t('fund.pledged'))}</th><th class="money">${esc(t('fund.received'))}</th><th>${esc(t('fund.progress'))}</th><th><span class="sr-only">${esc(t('common.actions'))}</span></th></tr></thead><tbody>
      ${e.contributors.map(c => `<tr data-key="c-${c.id}"><td class="full" data-label="${esc(t('fund.name'))}">${inp({ k:`c-${c.id}-name`, ch:'contrib-field', dataId:c.id, field:'name', value:c.name, label:t('fund.name'), placeholder:t('fund.namePh'), maxlength:60 })}</td>
        <td data-label="${esc(t('fund.type'))}">${selectEl({ k:`c-${c.id}-type`, ch:'contrib-field', dataId:c.id, field:'type', value:c.type, label:t('fund.type') + ' — ' + c.name, options:CONTRIB_TYPES.map(x => ({ v:x, l:t('fund.t.' + x) })) })}</td>
        <td data-label="${esc(t('fund.pledged'))}">${moneyInp({ k:`c-${c.id}-pledged`, ch:'contrib-money', dataId:c.id, field:'pledged', value:c.pledged, label:t('fund.pledged') + ' — ' + c.name })}</td>
        <td data-label="${esc(t('fund.received'))}">${moneyInp({ k:`c-${c.id}-received`, ch:'contrib-money', dataId:c.id, field:'received', value:c.received, label:t('fund.received') + ' — ' + c.name })}</td>
        <td class="full" data-label="${esc(t('fund.progress'))}" style="min-width:120px"><div class="progress accent" role="progressbar" aria-label="${esc(t('fund.progress'))}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${c.pledged ? Math.round(Math.min(1, c.received / c.pledged) * 100) : 0}"><span style="width:${c.pledged ? Math.min(1, c.received / c.pledged) * 100 : 0}%"></span></div><span class="small muted">${c.pledged ? fmtPct(c.received / c.pledged) : '—'}</span></td>
        <td><button class="btn-icon sm" data-act="contrib-delete" data-id="${c.id}" aria-label="${esc(t('fund.remove', { name:c.name || t('fund.contributor') }))}">${icon('trash')}</button></td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="2">${esc(t('pay.total'))}</td><td class="money">${fmtMoney(pledged)}</td><td class="money">${fmtMoney(received)}</td><td colspan="2"></td></tr></tfoot></table></div>`
      : emptyState({ icon:'heart', title:t('fund.empty'), text:t('fund.emptyText'), cta:t('fund.add'), ctaAttrs:{ 'data-act':'contrib-add' } })}
  </div></section>`;
};

function themeColors(){

  const g = n => cs.getPropertyValue(n).trim();
  return { ink:g('--ink'), muted:g('--muted'), line:g('--line'), surface:g('--surface'), accent:g('--accent'), rose:g('--rose'), danger:g('--danger'), soft:g('--line-strong') };

function cashflowData(e){
  const today = todayISO().slice(0,7);
  const ms = e.payments.map(p => (p.paidDate || p.due || '').slice(0,7)).filter(Boolean);
  let start = [today].concat(ms).sort()[0];
  let end = [e.date.slice(0,7)].concat(ms).sort().pop();
  const months = [];
  let d = parseISO(start + '-01');
  while(isoOf(d).slice(0,7) <= end && months.length < 36){ months.push(isoOf(d).slice(0,7)); d.setMonth(d.getMonth() + 1); }
  const shown = months.slice(-24);
  const paid = shown.map(() => 0), sched = shown.map(() => 0);
  e.payments.forEach(p => {
    if(p.paidDate){ const i = shown.indexOf(p.paidDate.slice(0,7)); if(i >= 0) paid[i] += signedPay(p); }
    else if(p.due){ const i = shown.indexOf(p.due.slice(0,7)); if(i >= 0) sched[i] += signedPay(p); }
  });
  return { months:shown, paid, sched };
}
function fallbackChart(id){
  const e = ev(), r = C, th = { accent:'var(--accent)', rose:'var(--rose)', danger:'var(--danger)', soft:'var(--line-strong)' };

    const stops = e.categories.map((c,i) => { const a = acc; acc += r.cats.get(c.id).alloc / tot * 360; return `${catColor(i)} ${a}deg ${acc}deg`; });
    return `<div class="donut-fallback" style="background:conic-gradient(${stops.join(',') || 'var(--surface-3) 0 360deg'})"></div>`;
  }
  if(id === 'chBars'){
    const max = Math.max(1, ...e.categories.map(c => Math.max(r.cats.get(c.id).alloc, r.cats.get(c.id).forecast)));
    return e.categories.map((c,i) => { const cc = r.cats.get(c.id); return `<div class="hbar"><span class="lbl" title="${esc(c.name)}">${esc(c.name)}</span><div class="bars">
      <span style="width:${cc.alloc / max * 100}%;background:${th.soft}" title="${esc(t('chart.planned'))} ${esc(fmtMoney(cc.alloc))}"></span>
      <span style="width:${cc.forecast / max * 100}%;background:${cc.forecast > cc.alloc ? th.danger : catColor(i)}" title="${esc(t('chart.actual'))} ${esc(fmtMoney(cc.forecast))}"></span></div></div>`; }).join('')
      + `<div class="legend"><span><i style="background:${th.soft}"></i>${esc(t('chart.planned'))}</span><span><i style="background:var(--accent)"></i>${esc(t('chart.actual'))}</span></div>`;
  }
  if(id === 'chFlow'){
    const d = cashflowData(e); const max = Math.max(1, ...d.months.map((m,i) => d.paid[i] + d.sched[i]));
    return `<div class="vbars">${d.months.map((m,i) => `<div class="col" title="${esc(fmtMonth(m))}: ${esc(fmtMoney(d.paid[i] + d.sched[i]))}">
      <span style="height:${Math.max(0, d.sched[i]) / max * 150}px;background:${th.rose}"></span><span style="height:${Math.max(0, d.paid[i]) / max * 150}px;background:${th.accent};border-radius:0"></span><small>${esc(fmtMonthShort(m))}</small></div>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>${esc(t('chart.paid'))}</span><span><i style="background:var(--rose)"></i>${esc(t('chart.scheduled'))}</span></div>`;
  }
  return '';
}
function upsertChart(id, config){

/* Count-up animation for KPI numbers */
const countPrev = {};
function animateCounts(){
  const rm = reducedMotion();
  $$('[data-ck]').forEach(el => {
    const k = el.dataset.ck, to = Number(el.dataset.count);
    const from = countPrev[k] ?? 0; countPrev[k] = to;
    if(from === to || rm) return;
    const t0 = performance.now(), dur = 700;
    const step = now => {
      if(Number(el.dataset.count) !== to) return; // superseded
      const p = Math.min(1, (now - t0) / dur), ease = 1 - Math.pow(1 - p, 3);
      el.textContent = fmtMoney(p < 1 ? Math.round((from + (to - from) * ease) / 100) * 100 : to);
      if(p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function fieldError(el, msg){

function clearFieldError(el){

/* Validated readers: return value or null (and show an inline error). */
function readMoney(el, o = {}){
  const v = parseMoney(el.value);
  if(isNaN(v)) return fieldError(el, t('err.number'));
  if(o.required && v <= 0) return fieldError(el, t('err.positive'));
  if(v < 0) return fieldError(el, t('err.negative'));
  if(v > 1e13) return fieldError(el, t('err.tooLarge'));
  clearFieldError(el); return v;
}
function readInt(el, o = {}){
  const s = String(el.value).trim();
  const v = Number(s);
  if(s === '' || !Number.isFinite(v) || Math.floor(v) !== v) return fieldError(el, t('err.int'));
  if(v < (o.min ?? 0)) return fieldError(el, t('err.negative'));
  if(o.max != null && v > o.max) return fieldError(el, t('err.max', { n:o.max }));
  clearFieldError(el); return v;
}
function readText(el, o = {}){
  const v = String(el.value || '').trim();
  if(o.required && !v) return fieldError(el, t('err.required'));
  clearFieldError(el); return v;
}
function readDate(el, o = {}){
  const v = String(el.value || '').trim();

  if(!validISO(v)) return fieldError(el, t('err.date'));

}

    form.querySelector('#p-paidDate-wrap').classList.toggle('hidden', !form.querySelector('#p-paid').checked);
  };
  openDialog({ title:id ? t('pay.editTitle') : t('pay.addTitle'), body, onOpen:sync, onInput:sync,
    onSubmit:form => {

        if(amount <= 0){ fieldError(el, t('err.noContract')); return false; }
      } else { amount = readMoney(form.querySelector('#p-amt'), { required:true }); if(amount === null) return false; }
      const due = readDate(form.querySelector('#p-due'), { required:true }); if(due === null) return false;
      let paidDate = '';
      if(form.querySelector('#p-paid').checked){ paidDate = readDate(form.querySelector('#p-paidDate'), { required:true }); if(paidDate === null) return false; }
      dispatch('pay/save', { data:{ id:id || undefined, itemId:itemSel.value, type:form.querySelector('#p-type').value, amount, due, paidDate, method:form.querySelector('#p-method').value, ref:form.querySelector('#p-ref').value.trim(), note:form.querySelector('#p-note').value.trim() } });

/* ---------- Schedule generator ---------- */
function openScheduleDialog(itemId){
  const e = ev();
  const eligible = e.items.filter(i => C.items.get(i.id).balance > 0);
  if(!eligible.length){ toast(t('sched.none')); return; }
  const sel = eligible.some(i => i.id === itemId) ? itemId : eligible[0].id;
  let rows = [{ pct:30, when:'now', days:0 }, { pct:40, when:'before', days:60 }, { pct:30, when:'before', days:7 }];
  const rowHtml = () => rows.map((r,i) => `<div class="row-wrap" style="align-items:flex-end" data-row="${i}">
    <div class="field" style="width:96px"><label for="s-pct-${i}">${esc(t('sched.share'))}</label><div class="pct-wrap"><input class="input" id="s-pct-${i}" data-f="pct" inputmode="decimal" value="${r.pct}"></div></div>
    <div class="field" style="flex:1 1 150px"><label for="s-when-${i}">${esc(t('sched.when'))}</label><select class="select" id="s-when-${i}" data-f="when"><option value="now"${r.when === 'now' ? ' selected' : ''}>${esc(t('sched.now'))}</option><option value="before"${r.when === 'before' ? ' selected' : ''}>${esc(t('sched.before'))}</option></select></div>
    <div class="field ${r.when === 'now' ? 'hidden' : ''}" style="width:110px"><label for="s-days-${i}">${esc(t('sched.days'))}</label><input class="input" id="s-days-${i}" data-f="days" type="number" min="0" max="1000" inputmode="numeric" value="${r.days}"></div>
    <button type="button" class="btn-icon sm" data-dact="del" data-i="${i}" aria-label="${esc(t('sched.removeRow', { n:i + 1 }))}" ${rows.length < 2 ? 'disabled' : ''}>${icon('x')}</button></div>`).join('');
  const plan = form => {
    const iid = form.querySelector('#s-item').value; const x = C.items.get(iid);
    const base = Math.max(0, x ? x.balance : 0);
    const today = todayISO();
    let acc = 0;
    return rows.map((r,i) => {
      const amt = i === rows.length - 1 ? base - acc : Math.round(base * (Number(r.pct) || 0) / 100);
      acc += amt;
      let due = r.when === 'now' ? today : addDays(e.date, -(Number(r.days) || 0));
      if(due < today) due = today;
      const type = i === rows.length - 1 && rows.length > 1 ? 'final' : i === 0 && !(x && x.paid) ? 'deposit' : 'installment';
      return { amount:amt, due, type };
    });
  };
  const preview = form => {
    rows.forEach((r,i) => { const g = f => form.querySelector(`#s-${f}-${i}`); if(g('pct')){ r.pct = parseFloat(String(g('pct').value).replace(',', '.')) || 0; r.when = g('when').value; r.days = parseInt(g('days').value, 10) || 0; g('days').closest('.field').classList.toggle('hidden', r.when === 'now'); } });
    const s = sum(rows, r => r.pct);
    const x = C.items.get(form.querySelector('#s-item').value);
    form.querySelector('#s-base').textContent = t('sched.base', { amt:fmtMoney(x ? x.balance : 0) });
    form.querySelector('#s-sum').innerHTML = `<span class="${Math.abs(s - 100) < 0.01 ? 'pos' : 'neg'} strong">${esc(t('sched.sum', { pct:nf(uiLocale(), { maximumFractionDigits:1 }).format(s) }))}</span>`;
    form.querySelector('#s-preview').innerHTML = plan(form).map(p => `<li><span class="grow">${esc(t('pay.type.' + p.type))} · ${esc(fmtDate(p.due))}</span><b class="money">${fmtMoney(p.amount)}</b></li>`).join('');
  };
  const body = `${field(t('pay.item'), `<select class="select" id="s-item">${itemOptionsHtml(e, sel, i => C.items.get(i.id).balance > 0)}</select>`, 's-item')}
    <p class="small muted" id="s-base"></p>
    <div class="stack-sm" id="s-rows">${rowHtml()}</div>
    <div class="row-wrap"><button type="button" class="btn btn-sm" data-dact="add">${icon('plus','i-sm')}${esc(t('sched.addRow'))}</button><span class="spacer"></span><span id="s-sum" aria-live="polite"></span></div>
    <label class="check"><input type="checkbox" id="s-replace" checked><span>${esc(t('sched.replace'))}</span></label>
    <div><h3 style="font-size:19px">${esc(t('sched.preview'))}</h3><ul class="list" id="s-preview"></ul></div>`;
  openDialog({ title:t('sched.title'), body, submit:t('sched.create'), onOpen:preview, onInput:preview,
    onAction:(a, btn, form) => {
      preview(form);
      if(a === 'add') rows.push({ pct:0, when:'before', days:30 });
      if(a === 'del') rows.splice(Number(btn.dataset.i), 1);
      form.querySelector('#s-rows').innerHTML = rowHtml(); preview(form);
    },
    onSubmit:form => {
      preview(form);
      const s = sum(rows, r => r.pct);
      if(Math.abs(s - 100) > 0.01){ fieldError(form.querySelector('#s-pct-0'), t('err.sum100')); return false; }
      const pl = plan(form).filter(p => p.amount > 0);
      if(!pl.length){ toast(t('sched.none')); return false; }
      dispatch('pay/generate', { itemId:form.querySelector('#s-item').value, rows:pl, replace:form.querySelector('#s-replace').checked });
      toast(t('toast.schedCreated', { n:pl.length }));
    } });
}

/* =====================================================================

const W = { step:0, first:false, data:null };
function guessCurrency(){
  const l = (navigator.language || '').toLowerCase();
  if(l.endsWith('-ma') || l.startsWith('ar-ma')) return 'MAD';
  if(l.endsWith('-ae')) return 'AED'; if(l.endsWith('-sa')) return 'SAR'; if(l.endsWith('-gb')) return 'GBP'; if(l.endsWith('-us')) return 'USD';
  return state.prefs.lang === 'ar' ? 'MAD' : 'EUR';
}
function guessFormat(){ const l = state.prefs.lang; return l === 'fr' ? 'fr-FR' : 'en-US'; }
function openWizard(first){
  W.step = 0; W.first = !!first;
  W.data = { type:'wedding', name:'', date:addDays(todayISO(), 240), location:'', currency:guessCurrency(), customSymbol:'', numberFormat:guessFormat(), budget:'', guests:100, contingency:8, priorities:[], sample:false };
  renderWizard();
  const d = $('#wizard'); if(!d.open) d.showModal();
  focusWizard();
}
function focusWizard(){ const d = $('#wizard'); const f = d.querySelector('[aria-checked="true"], .dlg-body input, .dlg-body select'); if(f) f.focus(); }
function renderWizard(){
  const d = $('#wizard'), w = W.data, s = W.step;

  let body = '';

    <div class="alert info">${icon('sparkle')}<div style="flex:1">${esc(t('wiz.sampleText'))}</div><button type="button" class="btn btn-sm" data-wact="sample">${esc(t('wiz.loadSample'))}</button></div>`;
  if(s === 1) body = `<div class="form-grid">
    ${field(t('wiz.name'), inp({ id:'w-name', value:w.name, placeholder:t('wiz.namePh', { type:t('type.' + w.type) }), maxlength:80, required:true }), 'w-name', '', 'full')}
    ${field(t('wiz.date'), inp({ id:'w-date', type:'date', value:w.date, required:true }), 'w-date')}
    ${field(t('wiz.location'), inp({ id:'w-loc', value:w.location, placeholder:t('wiz.locationPh'), maxlength:100 }), 'w-loc')}

    ${w.currency === 'CUSTOM' ? field(t('wiz.symbol'), inp({ id:'w-sym', value:w.customSymbol, maxlength:5, placeholder:'₺' }), 'w-sym') : `<div></div>`}
    ${field(t('wiz.numberFormat'), selectEl({ id:'w-nf', value:w.numberFormat, options:NUMBER_FORMATS.map(n => ({ v:n.id, l:n.sample })) }), 'w-nf')}
  </div>`;
  if(s === 2) body = `<div class="form-grid">
    ${field(t('budget.total'), moneyInp({ id:'w-budget', value:w.budget === '' ? '' : w.budget, placeholder:fmtInput(2500000), required:true }), 'w-budget', t('wiz.budgetHint'), 'full')}
    ${field(t('wiz.guests'), inp({ id:'w-guests', type:'number', inputmode:'numeric', min:0, step:1, value:w.guests }), 'w-guests')}
    ${field(t('wiz.contingency'), `<div class="pct-wrap">${inp({ id:'w-cont', type:'number', inputmode:'decimal', min:0, max:50, step:0.5, value:w.contingency })}</div>`, 'w-cont', t('wiz.contingencyHint'))}

  }

function readWizardStep(){
  const d = $('#wizard'), w = W.data, s = W.step;
  const g = id => d.querySelector('#' + id);
  if(s === 1){
    const name = readText(g('w-name')); const date = readDate(g('w-date'), { required:true });
    if(date === null) return false;
    w.name = name || ''; w.date = date; w.location = g('w-loc').value.trim(); w.currency = g('w-cur').value; w.numberFormat = g('w-nf').value;
    if(g('w-sym')) w.customSymbol = g('w-sym').value.trim();
    if(w.currency === 'CUSTOM' && !w.customSymbol){ fieldError(g('w-sym'), t('err.required')); return false; }
    nfCache.clear();
  }
  if(s === 2){
    const el = g('w-budget');
    const b = el.value.trim() === '' ? 2500000 : readMoney(el); if(b === null) return false;
    const n = readInt(g('w-guests'), { max:100000 }); if(n === null) return false;
    const c = parseFloat(g('w-cont').value);
    if(!isFinite(c) || c < 0 || c > 50){ fieldError(g('w-cont'), t('err.range', { a:0, b:50 })); return false; }
    w.budget = b; w.guests = n; w.contingency = c;
  }
  if(s === 3) w.sample = g('w-sample').checked;
  return true;
}
function finishWizard(skip){
  const w = W.data;
  if(skip && !W.first){ $('#wizard').close(); return; }
  const e = newEvent(skip ? { type:'wedding' } : { type:w.type, name:w.name || t('type.' + w.type), date:w.date, location:w.location, currency:w.currency, customSymbol:w.customSymbol,
    numberFormat:w.numberFormat, totalBudget:w.budget === '' ? 2500000 : w.budget, guests:w.guests, contingencyPct:w.contingency, priorities:w.priorities });
  if(!skip && w.sample) fillSample(e);
  addEvent(e);
  $('#wizard').close();
  toast(t('toast.eventCreated', { name:e.name }));
}
function addEvent(e){
  pushUndo();
  state.events[e.id] = e; state.activeEventId = e.id;
  ui.tab = 'dashboard'; if(location.hash !== '#dashboard') history.replaceState(null, '', '#dashboard');
  nfCache.clear(); scheduleSave(); render();
}
function wizardClick(ev){
  const b = ev.target.closest('[data-wact]'); if(!b) return;
  const a = b.dataset.wact, w = W.data;
  if(a === 'type'){ w.type = b.dataset.v; w.priorities = []; renderWizard(); $('#wizard [aria-checked="true"]').focus(); }
  if(a === 'prio'){ const k = b.dataset.v; if(w.priorities.includes(k)) w.priorities = w.priorities.filter(x => x !== k); else if(w.priorities.length < 3) w.priorities.push(k); else { toast(t('wiz.max3')); return; } renderWizard(); const nb = $(`#wizard [data-wact="prio"][data-v="${k}"]`); if(nb) nb.focus(); }
  if(a === 'back'){ readWizardStep(); W.step = Math.max(0, W.step - 1); renderWizard(); focusWizard(); }
  if(a === 'skip') finishWizard(true);
  if(a === 'sample'){
    const e = newEvent({ type:'wedding', name:t('sample.name'), location:t('sample.location'), currency:W.data.currency, numberFormat:W.data.numberFormat, totalBudget:2800000, guests:110, contingencyPct:8, priorities:['photo','catering','venue'] });
    e.date = addDays(todayISO(), 200);
    fillSample(e); addEvent(e); $('#wizard').close(); toast(t('toast.sampleLoaded'));
  }
}
function wizardKeydown(ev){
  const b = ev.target.closest('[role="radio"][data-wact="type"]'); if(!b) return;
  const keys = { ArrowRight:1, ArrowDown:1, ArrowLeft:-1, ArrowUp:-1 }; let dir = keys[ev.key]; if(!dir) return;
  if(isRTL() && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) dir = -dir;

/* =====================================================================
   RENDER ENGINE — dispatch → save → re-render (DOM morphing keeps focus)
   ===================================================================== */
let lastTab = null;
let syncEl = null; // element whose value must be re-synced even though it has focus
function dispatch(type, payload = {}, opts = {}){
  const fn = R[type]; const e = ev();
  if(!fn || !e) return;
  if(opts.undo !== false) pushUndo();
  const res = fn(e, payload);
  if(res === false && opts.undo !== false){ undoStack.pop(); }
  scheduleSave();
  if(opts.render !== false) render();
  return res;
}
function pushUndo(){ undoStack.push(JSON.stringify(state)); if(undoStack.length > MAX_UNDO) undoStack.shift(); const ub = $('#undoBtn'); if(ub) ub.disabled = false; }
function undo(){
  if(!undoStack.length){ toast(t('toast.nothingUndo')); return; }
  state = JSON.parse(undoStack.pop());
  nfCache.clear(); applyPrefs(); scheduleSave(); render(); toast(t('toast.undone'));
}
let saveTimer = null;
function scheduleSave(){ setSaved('saving'); clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 300); }
function saveNow(){ clearTimeout(saveTimer); const ok = Store.save(state); setSaved(ok ? 'saved' : 'off'); }
function setSaved(st){
  const el = $('#saved'); if(!el) return;
  el.dataset.state = st;
  const txt = st === 'saving' ? t('saved.saving') : st === 'off' ? t('saved.off') : t('saved.saved');
  el.querySelector('.saved-text').textContent = txt; el.title = txt;
}

function render(){
  const main = $('#main');
  const e = ev();
  C = e ? computeAll(e) : null;
  renderChrome();
  if(!e){ main.innerHTML = renderNoEvent(); lastTab = null; destroyCharts(); return; }
  const html = (VIEWS[ui.tab] || VIEWS.dashboard)();
  const focus = captureFocus();
  if(lastTab !== ui.tab){ destroyCharts(); main.innerHTML = html; lastTab = ui.tab; }
  else { const tpl = document.createElement('template'); tpl.innerHTML = html; morphChildren(main, tpl.content); }
  restoreFocus(focus);
  if(AFTER[ui.tab]) AFTER[ui.tab]();
  animateCounts();
  syncEl = null;
}
function captureFocus(){
  const a = document.activeElement;
  if(!a || !a.dataset || !a.dataset.k) return null;
  let s = null, en = null; try { s = a.selectionStart; en = a.selectionEnd; } catch(_){}
  return { k:a.dataset.k, s, en };
}
function restoreFocus(f){
  if(!f) return;
  const el = document.querySelector(`[data-k="${CSS.escape(f.k)}"]`);
  if(el && document.activeElement !== el){ el.focus({ preventScroll:true }); try { if(f.s != null && el !== syncEl) el.setSelectionRange(f.s, f.en); } catch(_){} }
}
/* Minimal keyed DOM morph: updates existing nodes in place so focus, scroll and clicks survive re-renders. */
function sameNode(a, b){
  if(a.nodeType !== b.nodeType) return false;
  if(a.nodeType !== 1) return true;
  return a.tagName === b.tagName && a.getAttribute('data-key') === b.getAttribute('data-key') && (a.type || '') === (b.type || '');
}
function morphNode(a, b){
  if(a.nodeType === 3 || a.nodeType === 8){ if(a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  for(const { name, value } of Array.from(b.attributes)) if(a.getAttribute(name) !== value) a.setAttribute(name, value);
  for(const { name } of Array.from(a.attributes)) if(!b.hasAttribute(name)) a.removeAttribute(name);
  const tag = a.tagName;
  const active = a === document.activeElement && a !== syncEl;
  if(tag === 'INPUT'){
    if(a.type === 'checkbox' || a.type === 'radio') a.checked = b.hasAttribute('checked');
    else if(!active){ const v = b.getAttribute('value') ?? ''; if(a.value !== v) a.value = v; }
    return;
  }
  if(tag === 'TEXTAREA'){ if(!active && a.value !== b.textContent) a.value = b.textContent; return; }
  if(tag === 'CANVAS') return;
  morphChildren(a, b);
  if(tag === 'SELECT'){ const i = Array.from(b.options).findIndex(o => o.hasAttribute('selected')); a.selectedIndex = i >= 0 ? i : 0; }
}
function morphChildren(a, b){
  const keyed = new Map();
  for(const c of Array.from(a.childNodes)) if(c.nodeType === 1 && c.hasAttribute('data-key')) keyed.set(c.getAttribute('data-key'), c);
  let cur = a.firstChild;
  for(const nb of Array.from(b.childNodes)){
    const k = nb.nodeType === 1 ? nb.getAttribute('data-key') : null;
    let match = null;
    if(k){ match = keyed.get(k) || null; if(match && !sameNode(match, nb)) match = null; }
    else if(cur && sameNode(cur, nb)) match = cur;
    if(match){
      if(k) keyed.delete(k);
      if(match === cur) cur = cur.nextSibling; else a.insertBefore(match, cur);
      morphNode(match, nb);
    } else a.insertBefore(nb, cur);
  }
  while(cur){ const n = cur.nextSibling; a.removeChild(cur); cur = n; }
}

/* ---------- Toasts (aria-live region) ---------- */
function toast(msg, o = {}){
  const box = $('#toasts');
  while(box.children.length >= 3) box.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span class="msg">${esc(msg)}</span>${o.undo ? `<button type="button">${esc(t('common.undo'))}</button>` : ''}`;
  box.appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  if(o.undo) el.querySelector('button').addEventListener('click', () => { kill(); undo(); });
  setTimeout(kill, o.undo ? 7000 : 3200);
}

}

/* ---------- Drag to reorder (pointer events: mouse + touch) & keyboard ---------- */
let drag = null;
function onPointerDown(ev){
  const h = ev.target.closest('.handle[data-drag]'); if(!h || ev.button > 0) return;
  const kind = h.dataset.drag;
  const row = h.closest(kind === 'cat' ? '.cat' : '.irow');
  drag = { kind, id:h.dataset.id, row, y:ev.clientY, active:false, target:null, pid:ev.pointerId, h };
  try { h.setPointerCapture(ev.pointerId); } catch(_){}
}
function clearDropMarks(){ $$('.drop-before,.drop-after').forEach(n => n.classList.remove('drop-before','drop-after')); }
function onPointerMove(ev){
  if(!drag || ev.pointerId !== drag.pid) return;
  if(!drag.active){ if(Math.abs(ev.clientY - drag.y) < 5) return; drag.active = true; drag.row.classList.add('dragging'); }
  ev.preventDefault();
  clearDropMarks();
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  let tgt = under && under.closest(drag.kind === 'cat' ? '[data-drop="cat"]' : '[data-drop="item"]');
  if(!tgt && drag.kind === 'item'){ const box = under && under.closest('[data-drop-cat]'); if(box) drag.target = { catId:box.dataset.dropCat, beforeId:null }; else drag.target = null; }
  else if(tgt && tgt !== drag.row){
    const r = tgt.getBoundingClientRect(); const before = ev.clientY < r.top + r.height / 2;
    tgt.classList.add(before ? 'drop-before' : 'drop-after');
    drag.target = { id:tgt.dataset.id, before, catId:tgt.dataset.cat };
  } else drag.target = null;
  if(ev.clientY < 70) window.scrollBy(0, -12); else if(ev.clientY > window.innerHeight - 90) window.scrollBy(0, 12);
}
function onPointerUp(evt){
  if(!drag || evt.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  d.row.classList.remove('dragging'); clearDropMarks();
  if(!d.active || !d.target) return;
  const e = ev();
  if(d.kind === 'cat'){
    const list = e.categories.map(c => c.id); const i = list.indexOf(d.target.id);
    const beforeId = d.target.before ? d.target.id : (list[i + 1] === d.id ? list[i + 2] : list[i + 1]) || null;
    dispatch('cat/move', { id:d.id, beforeId });
  } else {
    if(d.target.id){
      const sameCat = e.items.filter(x => x.catId === d.target.catId).map(x => x.id).filter(x => x !== d.id);
      const i = sameCat.indexOf(d.target.id);
      const beforeId = d.target.before ? d.target.id : sameCat[i + 1] || null;
      dispatch('item/move', { id:d.id, catId:d.target.catId, beforeId });
    } else dispatch('item/move', { id:d.id, catId:d.target.catId, beforeId:null });
  }
  const h = $(`[data-k="drag-${d.kind}-${d.id}"]`); if(h) h.focus({ preventScroll:true });
}
function onHandleKey(evt){
  const h = evt.target.closest('.handle[data-drag]'); if(!h || (evt.key !== 'ArrowUp' && evt.key !== 'ArrowDown')) return;
  evt.preventDefault();
  const e = ev(), up = evt.key === 'ArrowUp', id = h.dataset.id;
  if(h.dataset.drag === 'cat'){
    const list = e.categories.map(c => c.id); const i = list.indexOf(id);
    if(up && i > 0) dispatch('cat/move', { id, beforeId:list[i - 1] });
    if(!up && i < list.length - 1) dispatch('cat/move', { id, beforeId:list[i + 2] || null });
  } else {
    const it = byId(e.items, id); const list = e.items.filter(x => x.catId === it.catId).map(x => x.id); const i = list.indexOf(id);
    if(up && i > 0) dispatch('item/move', { id, catId:it.catId, beforeId:list[i - 1] });
    else if(!up && i < list.length - 1) dispatch('item/move', { id, catId:it.catId, beforeId:list[i + 2] || null });
  }
  const nh = $(`[data-k="drag-${h.dataset.drag}-${id}"]`); if(nh) nh.focus();
}

function bindEvents(){
  document.addEventListener('click', ev => {
    const el = ev.target.closest('[data-act]');
    if(!el || el.closest('#dlg, #wizard') || el.disabled) return;
    const fn = ACT[el.dataset.act]; if(fn){ ev.preventDefault(); fn(el, ev); }
  });
  document.addEventListener('change', ev => {
    const el = ev.target.closest('[data-ch]'); if(!el || el.closest('#dlg, #wizard')) return;
    const fn = CH[el.dataset.ch]; if(fn){ syncEl = el; fn(el, ev); }
  });
  document.addEventListener('submit', ev => {
    const f = ev.target.closest('form[data-form]'); if(!f) return;
    ev.preventDefault(); FORMS[f.dataset.form] && FORMS[f.dataset.form](f);
  });
  const search = debounce(v => { ui.search = v; render(); }, 180);
  document.addEventListener('input', ev => { const el = ev.target; if(el.dataset && el.dataset.in === 'search') search(el.value); });
  $('#eventSelect').addEventListener('change', evt => { const v = evt.target.value; if(v === '__new'){ evt.target.value = state.activeEventId || '__new'; openWizard(!ev()); } else switchEvent(v); });
  $('#themeBtn').addEventListener('click', () => ACT.theme());
  $('#undoBtn').addEventListener('click', () => undo());
  document.addEventListener('pointerdown', onPointerDown);
  document.addEventListener('pointermove', onPointerMove, { passive:false });
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('pointercancel', onPointerUp);
  document.addEventListener('keydown', ev => {
    onHandleKey(ev);
    if((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && ev.key.toLowerCase() === 'z'){
      const a = document.activeElement;
      const editable = a && (a.isContentEditable || (/^(INPUT|TEXTAREA)$/.test(a.tagName) && !a.readOnly && !['checkbox','radio','button'].includes(a.type)));
      if(editable || $('#dlg').open || $('#wizard').open) return; // native undo inside fields
      ev.preventDefault(); undo();
    }
  });
  const wz = $('#wizard');
  wz.addEventListener('click', wizardClick);
  wz.addEventListener('keydown', wizardKeydown);
  wz.addEventListener('submit', wizardSubmit);
  wz.addEventListener('change', ev => { if(ev.target.id === 'w-cur'){ W.data.currency = ev.target.value; readWizardStep(); renderWizard(); const n = $('#w-cur'); if(n) n.focus(); } });
  wz.addEventListener('cancel', ev => { ev.preventDefault(); finishWizard(true); });
  $('#dlg').addEventListener('close', () => { $('#dlg').innerHTML = ''; if(dlgReturn && document.contains(dlgReturn)) dlgReturn.focus(); dlgReturn = null; });
  window.addEventListener('hashchange', () => { const tab = tabFromHash(); if(tab !== ui.tab){ ui.tab = tab; render(); window.scrollTo(0, 0); $('#main').focus({ preventScroll:true }); } });
  window.addEventListener('beforeprint', () => buildPrint(ui.printMode || ''));
  window.addEventListener('afterprint', () => { ui.printMode = ''; });
  window.addEventListener('pagehide', saveNow);
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(state.prefs.theme === 'auto'){ destroyCharts(); lastTab = null; render(); } }); } catch(_){}
  window.addEventListener('storage', ev => { if(ev.key === STORAGE_KEY && ev.newValue){ try { const d = migrate(JSON.parse(ev.newValue)); if(d){ state = d; applyPrefs(); render(); } } catch(_){} } });
}
function tabFromHash(){ const h = (location.hash || '').slice(1); return TABS.some(x => x.id === h) ? h : 'dashboard'; }
